tool({
  id: 'solve', cat: 'system', name: 'Solve Xw = y (auto: X⁻¹ / left / right inverse)', short: 'Solve Xw = y',
  kw: 'solve linear system equations Xw=y 연립방정식 even over under determined least squares exact approximate constrained w^T X = y^T',
  desc: 'No bias column is added here (a system of linear equations has no bias term). For regression with bias use “Linear Regression”.',
  inputs: [
    { k: 'form', type: 'select', label: 'System written as', def: 'Xw', options: [['Xw', 'Xw = y'], ['wX', 'wᵀX = yᵀ  (Tutorial 4 Q5/Q6 style)']] },
    { k: 'X', type: 'matrix', label: 'X', def: [[1, 1], [1, -1], [1, 0]], group: 'xy' },
    { k: 'y', type: 'vector', label: 'y', def: [1, 0, 2], group: 'xy', link: 'X' },
  ],
  solve(v, R) {
    let X = v.X, y = v.y;
    const tr = v.form === 'wX';
    R.given('X', X, { note: LA.dims(X) }).given('y', y);
    if (tr) {
      R.note(`wᵀX = yᵀ ⇔ Xᵀw = y. Number of equations = number of entries of y = ${y.length}; unknowns = rows of X = ${X.length}.`, 'info', 'given');
      X = LA.T(X);
      if (X.length !== y.length) uerr(`wᵀX = yᵀ needs X to have ${y.length} columns (length of y), but X has ${X.length}.`);
    } else if (X.length !== y.length) uerr(`X has ${X.length} rows but y has ${y.length} entries — one y per equation (row).`);
    const An = tr ? 'Xᵀ' : 'X';
    R.find('ŵ, and whether the solution is exact / approximate / constrained / none');
    const [m, d] = LA.shape(X);
    const st = sysType(m, d);
    const c = consistency(X, y);
    R.detect(`${st.name}: ${m} equations, ${d} unknowns. rank(${An}) = ${c.rX}, rank([${An}, y]) = ${c.rXy} → ${c.kind === 'none' ? '<b>inconsistent</b>: no exact solution' : c.kind === 'unique' ? '<b>consistent</b>, unique solution' : '<b>consistent</b>, infinitely many solutions'}`);
    const Y = LA.col(y);
    if (c.kind === 'none' && m <= d) {
      R.step(`rank(${An}) = ${c.rX} < rank([${An}, y]) = ${c.rXy}`, undefined, { note: 'the equations contradict each other (for example parallel lines)' });
      R.step(`${An}ᵀ${An} invertible?`, undefined, { note: yesno(LA.isInvertible(LA.mul(LA.T(X), X))) });
      R.step(`${An}${An}ᵀ invertible?`, undefined, { note: yesno(LA.isInvertible(LA.mul(X, LA.T(X)))) });
      R.answer('ŵ', '<b class="no">No solution</b>', { sub: `${st.short} system is inconsistent. ${m === d ? `det(${An}) = 0 → ${An} not invertible.` : `Both ${An}${An}ᵀ and ${An}ᵀ${An} are not invertible.`}` });
      const w = LA.mul(LA.pinv(X), Y);
      R.check('(extra, not EE2211) least-squares min-norm pinv(X)y', w.map(r => r[0]));
      R.code(`import numpy as np\nX = ${pyArr(X)}\ny = ${pyArr(y)}\nprint(np.linalg.matrix_rank(X), np.linalg.matrix_rank(np.column_stack([X, y])))  # different -> no solution`);
      return;
    }
    const res = lsqSolve(X, Y, R, { Xn: An, yn: 'y' });
    const w = res.W.map(r => r[0]);
    let kind;
    if (res.form === 'inverse') kind = 'EXACT unique solution';
    else if (res.form === 'primal') kind = res.exact ? 'EXACT solution (rank(X) = rank([X,y]), so the least-squares answer fits every equation)' : 'APPROXIMATE (least-squares) solution — no exact solution exists';
    else if (res.form === 'dual') kind = 'CONSTRAINED exact solution (one of infinitely many; minimum-norm)';
    else kind = res.exact ? 'exact (pinv fallback)' : 'approximate (pinv fallback)';
    R.answer('ŵ', w, { rowLabels: wLabels(d, false), sub: kind });
    const Xw = LA.mul(X, res.W).map(r => r[0]);
    R.check(`${An}ŵ`, Xw, { note: 'compare with y = [' + y.map(t => fmtNum(t)).join(', ') + ']' });
    R.check('residual e = Xŵ − y', Xw.map((t, i) => t - y[i]), { note: `‖e‖² = ${fmtNum(res.sse)}` });
    const XX = tr ? 'X.T' : 'X';
    R.code(`import numpy as np
from numpy.linalg import inv
X = ${pyArr(v.X)}
y = ${pyArr(y)}
A = ${XX}          # coefficient matrix of the system A w = y
m, d = A.shape
if m == d:
    w = inv(A) @ y                    # even-determined
elif m > d:
    w = inv(A.T @ A) @ A.T @ y        # over-determined: left inverse (least squares)
else:
    w = A.T @ inv(A @ A.T) @ y        # under-determined: right inverse (constrained)
print(w)`);
  },
});

tool({
  id: 'pinv', cat: 'system', name: 'Pseudoinverse X† (left / right inverse)', short: 'X† pseudoinverse',
  kw: 'pseudoinverse pinv dagger left inverse right inverse 유사역행렬 tall wide',
  inputs: [{ k: 'X', type: 'matrix', label: 'X', def: [[1, 1], [1, -1], [1, 0]] }],
  solve(v, R) {
    const X = v.X;
    const [m, d] = LA.shape(X);
    const rk = LA.rank(X);
    R.given('X', X, { note: `${m}×${d}, rank ${rk}` });
    R.find('X† (NOT X⁻¹, NOT Xᵀ)');
    const XT = LA.T(X);
    if (m === d && rk === d) {
      R.formula('X square & invertible ⇒ X† = X⁻¹');
      R.answer('X† = X⁻¹', LA.inv(X));
      return;
    }
    if (m >= d) {
      R.detect(`X is ${m === d ? 'square (singular)' : 'tall (m > d)'} → try LEFT inverse`);
      R.formula('X† = (XᵀX)⁻¹Xᵀ', 'requires XᵀX invertible (rank X = d)');
      const XtX = LA.mul(XT, X);
      R.step('Xᵀ', XT).step('XᵀX', XtX, { note: `det = ${fmtNum(LA.det(XtX))}` });
      const inv = LA.inv(XtX);
      if (inv) {
        const P = LA.mul(inv, XT);
        R.step('(XᵀX)⁻¹', inv);
        R.answer('X† (left inverse)', P);
        R.check('X†X', LA.clean(LA.mul(P, X)), { note: '= I ✓ (left inverse)' });
        R.code(`import numpy as np\nfrom numpy.linalg import inv\nX = ${pyArr(X)}\nXdag = inv(X.T @ X) @ X.T\nprint(Xdag)\nprint(Xdag @ X)`);
        return;
      }
      R.note(`XᵀX is NOT invertible (rank ${rk} < d = ${d}) → (XᵀX)⁻¹Xᵀ does not exist.`, 'err');
    } else {
      R.detect('X is wide (m < d) → RIGHT inverse');
      R.formula('X† = Xᵀ(XXᵀ)⁻¹', 'requires XXᵀ invertible (rank X = m)');
      const XXt = LA.mul(X, XT);
      R.step('Xᵀ', XT).step('XXᵀ', XXt, { note: `det = ${fmtNum(LA.det(XXt))}` });
      const inv = LA.inv(XXt);
      if (inv) {
        const P = LA.mul(XT, inv);
        R.step('(XXᵀ)⁻¹', inv);
        R.answer('X† (right inverse)', P);
        R.check('XX†', LA.clean(LA.mul(X, P)), { note: '= I ✓ (right inverse)' });
        R.code(`import numpy as np\nfrom numpy.linalg import inv\nX = ${pyArr(X)}\nXdag = X.T @ inv(X @ X.T)\nprint(Xdag)\nprint(X @ Xdag)`);
        return;
      }
      R.note(`XXᵀ is NOT invertible (rank ${rk} < m = ${m}) → Xᵀ(XXᵀ)⁻¹ does not exist.`, 'err');
    }
    R.answer('EE2211 X†', '<b class="no">does not exist</b> (required inverse is singular)');
    R.check('Moore–Penrose pseudoinverse pinv(X) via Singular Value Decomposition (SVD), numpy', LA.pinv(X));
    R.code(`import numpy as np\nX = ${pyArr(X)}\nprint(np.linalg.pinv(X))`);
  },
});

/* ==== tools_calc.js ==== */
'use strict';
/* =====================================================================
   tools_calc.js — functions, derivative, gradient, Jacobian, Hessian,
   min / max / argmin / argmax, stationary points, linear vs affine
   ===================================================================== */

const EXPR_HINT = 'Use x^2, 2x, x*y, sqrt(), exp(), ln(), sin()… (implicit multiplication like <code>3x1</code> is OK; write <code>x*y</code> between two variables)';

function parseF(s, label = 'f') {
  let src = String(s).trim();
  src = src.replace(/^[A-Za-z]\w*\s*\([^)]*\)\s*=\s*/, '').replace(/^[A-Za-z]\w*\s*=\s*/, '');
  try { return EX.parse(src); } catch (e) { throw new UserError(`${label}: ${e.message}`); }
}
function varsOf(node, given) {
  if (given && String(given).trim()) return String(given).split(/[,\s]+/).filter(Boolean);
  return EX.varList(node);
}
function exprBox(n) { return { html: `<code class="expr">${esc(EX.str(n))}</code>` }; }

/* ---------- domain parsing ---------- */
function parseDomain(s) {
  const t = String(s || '').trim().replace(/∞/g, 'inf').replace(/ℝ/g, 'R');
  if (!t || /^(r|all|real|reals|\(-inf,\s*\+?inf\))$/i.test(t)) return { kind: 'int', a: -Infinity, b: Infinity, ca: false, cb: false, txt: '(−∞, ∞)' };
  if (/^\{.*\}$/.test(t)) {
    const vals = t.slice(1, -1).split(/[,;\s]+/).filter(Boolean).map(EX.constVal);
    return { kind: 'set', vals, txt: `{${vals.map(v => fmtNum(v)).join(', ')}}` };
  }
  const m = t.match(/^([\[(])\s*([^,]+?)\s*,\s*([^\])]+?)\s*([\])])$/);
  if (!m) throw new UserError(`Domain "${s}" not understood. Use [a, b], (a, b], (-inf, inf), R, or a finite set {1, 2, 3}`);
  const val = z => (/^[-−]\s*inf/i.test(z) ? -Infinity : /^\+?inf/i.test(z) ? Infinity : EX.constVal(z));
  const a = val(m[2]), b = val(m[3]);
  if (!(a < b)) throw new UserError('Domain needs a < b');
  return { kind: 'int', a, b, ca: m[1] === '[' && isFinite(a), cb: m[4] === ']' && isFinite(b), txt: `${m[1] === '[' && isFinite(a) ? '[' : '('}${fmtNum(a)}, ${fmtNum(b)}${m[4] === ']' && isFinite(b) ? ']' : ')'}` };
}

/* ---------- 1-D analysis ---------- */
function analyze1D(fNode, x, dom) {
  const f = t => EX.evaluate(fNode, { [x]: t });
  let dNode = null, d2Node = null;
  try { dNode = EX.diff(fNode, x); d2Node = EX.diff(dNode, x); } catch (e) { /* numeric fallback */ }
  const numD = (g, t) => { const hh = 1e-5 * Math.max(1, Math.abs(t)); return (g(t + hh) - g(t - hh)) / (2 * hh); };
  const df = dNode ? t => EX.evaluate(dNode, { [x]: t }) : t => numD(f, t);
  const d2f = d2Node ? t => EX.evaluate(d2Node, { [x]: t }) : t => numD(df, t);
  const inDomOpen = t => t > dom.a && t < dom.b;
  const L = isFinite(dom.a) ? dom.a : -100, H = isFinite(dom.b) ? dom.b : 100;
  const span = H - L;
  let crit = [];
  let constant = false;
  const P = dNode && EX.toPoly(dNode);
  const coeffs = P && EX.polyCoeffs(P, x);
  if (coeffs) {
    if (coeffs.every(c => Math.abs(c) < 1e-14)) constant = true;
    else crit = EX.realRoots(coeffs);
  } else {
    const N = 6000;
    let prevT = L, prev = df(L);
    for (let k = 1; k <= N; k++) {
      const t = L + (span * k) / N, cur = df(t);
      if (isFinite(prev) && isFinite(cur) && (prev === 0 || prev * cur < 0)) {
        let a = prevT, b = t, fa = prev;
        if (prev === 0) crit.push(prevT);
        else {
          for (let i = 0; i < 80; i++) { const mid = (a + b) / 2, fm = df(mid); if (fa * fm <= 0) b = mid; else { a = mid; fa = fm; } }
          crit.push((a + b) / 2);
        }
      }
      prevT = t; prev = cur;
    }
  }
  crit = crit.filter(inDomOpen);
  // non-differentiable kinks / missed extrema via grid on f
  const kinks = [];
  if (!constant) {
    const N = 4000, ts = [], fs = [];
    for (let k = 0; k <= N; k++) { const t = L + (span * k) / N; ts.push(t); fs.push(f(t)); }
    for (let k = 1; k < N; k++) {
      const isMin = fs[k] <= fs[k - 1] && fs[k] <= fs[k + 1] && (fs[k] < fs[k - 1] || fs[k] < fs[k + 1]);
      const isMax = fs[k] >= fs[k - 1] && fs[k] >= fs[k + 1] && (fs[k] > fs[k - 1] || fs[k] > fs[k + 1]);
      if (!isMin && !isMax) continue;
      if (crit.some(c => Math.abs(c - ts[k]) < (2 * span) / N)) continue;
      // golden refine
      let a = ts[k - 1], b = ts[k + 1];
      const g = isMin ? f : t => -f(t);
      for (let i = 0; i < 100; i++) { const m1 = a + (b - a) * 0.382, m2 = a + (b - a) * 0.618; if (g(m1) < g(m2)) b = m2; else a = m1; }
      const c = (a + b) / 2;
      if (inDomOpen(c) && !kinks.some(q => Math.abs(q - c) < 1e-6)) kinks.push(c);
    }
  }
  const pts = [];
  for (const c of crit) {
    const v2 = d2f(c);
    let type;
    if (v2 > 1e-9) type = 'local min';
    else if (v2 < -1e-9) type = 'local max';
    else {
      const hh = 1e-4 * Math.max(1, Math.abs(c));
      const s1 = df(c - hh), s2 = df(c + hh);
      type = s1 < 0 && s2 > 0 ? 'local min' : s1 > 0 && s2 < 0 ? 'local max' : 'stationary (inflection, not an extremum)';
    }
    pts.push({ x: c, fx: f(c), d2: v2, type, why: `f'(x) = 0, f''(x) = ${fmtNum(v2)}` });
  }
  for (const c of kinks) {
    const hh = 1e-6 * Math.max(1, Math.abs(c));
    const type = f(c) <= f(c - hh) && f(c) <= f(c + hh) ? 'local min' : 'local max';
    pts.push({ x: c, fx: f(c), type, why: "f' undefined / changes sign (corner)" });
  }
  pts.sort((p, q) => p.x - q.x);
  // candidates for global
  const cands = pts.filter(p => p.type.startsWith('local')).map(p => ({ ...p }));
  if (dom.ca) cands.push({ x: dom.a, fx: f(dom.a), type: 'endpoint' });
  if (dom.cb) cands.push({ x: dom.b, fx: f(dom.b), type: 'endpoint' });
  // boundary behaviour
  const ends = [];
  const probe = (t0, dir) => {
    if (isFinite(t0)) {
      const sc = Math.max(1, Math.abs(t0));
      const v3 = f(t0 + dir * 1e-3 * sc), v6 = f(t0 + dir * 1e-6 * sc), v9 = f(t0 + dir * 1e-9 * sc);
      if (!isFinite(v9)) return v9 > 0 || Number.isNaN(v9) ? (v6 > v3 ? Infinity : -Infinity) : v9;
      if (Math.abs(v9 - v6) > 100 * Math.max(1e-9, Math.abs(v6 - v3))) return v9 > v6 ? Infinity : -Infinity;
      return v9;
    }
    const vals = [1e2, 1e3, 1e4, 1e6].map(k => f(-dir * k));
    const last = vals[vals.length - 1];
    if (!isFinite(last)) return last > 0 || Number.isNaN(last) ? (vals[2] > vals[1] ? Infinity : -Infinity) : last;
    const growing = Math.abs(vals[3]) > Math.abs(vals[2]) * 1.5 && Math.abs(vals[2]) > Math.abs(vals[1]) * 1.2;
    return growing ? (vals[3] > 0 ? Infinity : -Infinity) : last;
  };
  if (!dom.ca) ends.push({ side: 'left', at: dom.a, lim: probe(dom.a, +1) });
  if (!dom.cb) ends.push({ side: 'right', at: dom.b, lim: probe(dom.b, -1) });
  return { f, df, d2f, dNode, d2Node, pts, cands, ends, constant };
}

tool({

tool({
  id: 'linaff', cat: 'calc', name: 'Linear vs Affine vs Neither', short: 'Linear / affine?',
  kw: 'linear affine function superposition homogeneity additivity offset bias 선형 아핀 true false',
  desc: 'Linear: f(x) = aᵀx (no constant). Affine: f(x) = aᵀx + b. Anything with x², x·y, sin… is neither.',
  inputs: [{ k: 'f', type: 'expr', label: 'f', def: '2.3 - 2x1 + 1.3x2 - x3', hint: EXPR_HINT, wide: true }],
  solve(v, R) {
    const n = parseF(v.f);
    const xs = EX.varList(n);
    R.given('f', exprBox(n)).given('variables', xs.join(', ') || '(none)');
    R.formula('linear ⇔ f(αx + βy) = αf(x) + βf(y) ⇔ f(x) = aᵀx ;  affine ⇔ f(x) = aᵀx + b');
    let affine = true;
    const a = [];
    for (const x of xs) {
      const g = EX.diff(n, x);
      a.push(g);
      for (const z of xs) {
        const hz = EX.diff(g, z);
        if (!(hz.t === 'num' && hz.v === 0)) {
          // numeric double-check
          const env = {}; xs.forEach(k => (env[k] = Math.random() * 3 + 0.5));
          const val = EX.evaluate(hz, env);
          if (Math.abs(val) > 1e-9) affine = false;
        }
      }
    }
    const zero = {}; xs.forEach(k => (zero[k] = 0));
    let b = 0;
    try { b = EX.evaluate(n, zero); } catch (e) { affine = false; }
    if (affine) {
      const av = a.map(g => EX.evaluate(g, zero));
      R.step('a (coefficients = ∇f, constant)', av, { rowLabels: xs });
      R.step('b = f(0) (offset / bias)', b);
      const lin = Math.abs(b) < 1e-12;
      R.answer('Type', lin ? '<b class="yes">LINEAR</b> (and therefore also affine)' : '<b>AFFINE but NOT linear</b>', { sub: lin ? 'f(x) = aᵀx' : `f(x) = aᵀx + b with b = ${fmtNum(b)} ≠ 0 ⇒ f(0) ≠ 0, superposition fails` });
      if (!lin) R.check('superposition test', undefined, { note: `f(2·0) = ${fmtNum(b)} but 2·f(0) = ${fmtNum(2 * b)}` });
    } else {
      R.answer('Type', '<b class="no">NEITHER linear nor affine</b>', { sub: 'contains non-linear terms (powers, products of variables, functions) — second derivatives are not all zero' });
    }
    R.note('Note: a polynomial model f(x) = w₀ + w₁x₁ + w₁₂x₁x₂ + w₁₁x₁² … is NONLINEAR in x, but still LINEAR in the parameters w (that is why least squares still works).', 'info', 'check');
  },
});

tool({
  id: 'deriv', cat: 'calc', name: 'Derivative df/dx (and f″)', short: 'Derivative',
  kw: 'derivative differentiate 미분 slope f prime second derivative',
  inputs: [
    { k: 'f', type: 'expr', label: 'f(x)', def: 'x^3 - 6x^2 + 9x + 1', hint: EXPR_HINT, wide: true },
    { k: 'x', type: 'text', label: 'with respect to (w.r.t.) variable', def: '', ph: 'auto' },
    { k: 'at', type: 'number', label: 'evaluate at x = (optional)', def: '', optional: true },
  ],
  solve(v, R) {
    const n = parseF(v.f);
    const xs = EX.varList(n);
    const x = (v.x || '').trim() || xs[0] || 'x';
    R.given('f', exprBox(n)).given('variable', x);
    const d1 = EX.diff(n, x), d2 = EX.diff(d1, x);
    R.find(`df/d${x}`);
    R.answer(`df/d${x}`, exprBox(d1));
    R.step(`d²f/d${x}²`, exprBox(d2));
    if (v.at != null) {
      if (xs.length > 1) uerr('Evaluation point needs values of all variables — use Partial derivative / Gradient tools.');
      const e = { [x]: v.at };
      R.answer(`f′(${fmtNum(v.at)})`, EX.evaluate(d1, e), { sub: `f(${fmtNum(v.at)}) = ${fmtNum(EX.evaluate(n, e))},  f″(${fmtNum(v.at)}) = ${fmtNum(EX.evaluate(d2, e))}` });
      const s = EX.evaluate(d1, e);
      R.note(s > 0 ? 'f′ > 0 → f is increasing here' : s < 0 ? 'f′ < 0 → f is decreasing here' : 'f′ = 0 → horizontal slope (possible max/min)', 'info', 'check');
    }
    R.code(`import sympy as sp\n${x} = sp.symbols('${x}')\nf = ${EX.str(n, true).replace(/np\./g, 'sp.')}\nprint(sp.diff(f, ${x}))`);
  },
});

tool({

  kw: 'gradient nabla 그래디언트 기울기 vector partial derivatives',
  desc: 'For scalar f of a d×1 vector x, ∇ₓf is a d×1 vector of partial derivatives.',
  inputs: [
    { k: 'f', type: 'expr', label: 'f(x)', def: '(w0 + w1 - 1)^2 + (w0 - w1)^2', hint: EXPR_HINT, wide: true },
    { k: 'vars', type: 'text', label: 'variable order (optional)', def: '', ph: 'auto, for example x1, x2' },

tool({
  id: 'jacobian', cat: 'calc', name: 'Jacobian of a vector function', short: 'Jacobian',
  kw: 'jacobian vector function matrix partial 야코비안 h x d',
  desc: 'One component per line. For f: ℝᵈ → ℝʰ the Jacobian is h×d: row i = ∇fᵢᵀ.',
  inputs: [
    { k: 'fs', type: 'exprs', label: 'f₁, f₂, … (one per line)', def: '-2x1\n3x1', rows: 4, wide: true },
    { k: 'vars', type: 'text', label: 'variables x (order)', def: '', ph: 'auto, for example x1, x2' },
    { k: 'pt', type: 'text', label: 'evaluate at (optional)', def: '' },
  ],
  solve(v, R) {
    const lines = String(v.fs).split(/\n/).map(s => s.trim()).filter(Boolean);
    if (!lines.length) uerr('Enter at least one function');
    const nodes = lines.map((s, i) => parseF(s, `f${i + 1}`));
    let xs = String(v.vars).trim() ? varsOf(null, v.vars) : [...new Set(nodes.flatMap(nd => EX.varList(nd)))].sort(EX.natSort);
    R.given('f(x)', nodes.map((nd, i) => `f${sub(i + 1)} = ${esc(EX.str(nd))}`).join('<br>')).given('x', `[${xs.join(', ')}]ᵀ`);
    R.formula('J = ∂f/∂x = [∂fᵢ/∂xⱼ]', `${nodes.length}×${xs.length} (h×d)`);
    const J = nodes.map(nd => xs.map(x => EX.diff(nd, x)));
    R.table(['', ...xs.map(x => `∂/∂${x}`)], J.map((row, i) => [`f${sub(i + 1)}`, ...row.map(e => `<code class="expr">${esc(EX.str(e))}</code>`)]), 'answer');
    if (String(v.pt).trim()) {
      const env = EX.parseAssign(v.pt);
      R.answer('J at point', J.map(r => r.map(e => EX.evaluate(e, env))));
    } else {
      const allConst = J.every(r => r.every(e => e.t === 'num'));
      if (allConst) R.answer('J (constant)', J.map(r => r.map(e => e.v)));
    }
  },
});

tool({
  id: 'hessian', cat: 'calc', name: 'Hessian (2nd derivatives) & convexity', short: 'Hessian',
  kw: 'hessian second derivative convex concave eigenvalues',
  inputs: [
    { k: 'f', type: 'expr', label: 'f(x)', def: 'x1^2 + x1*x2 + 2x2^2 - 4x1', hint: EXPR_HINT, wide: true },
    { k: 'pt', type: 'text', label: 'evaluate at (optional)', def: '' },
  ],
  solve(v, R) {
    const n = parseF(v.f);
    const xs = EX.varList(n);
    R.given('f', exprBox(n));
    const Hn = xs.map(a => xs.map(b => EX.diff(EX.diff(n, a), b)));
    R.table(['', ...xs], Hn.map((r, i) => [xs[i], ...r.map(e => `<code class="expr">${esc(EX.str(e))}</code>`)]), 'answer');
    const env = String(v.pt).trim() ? EX.parseAssign(v.pt) : Object.fromEntries(xs.map(x => [x, 0]));
    const H = Hn.map(r => r.map(e => EX.evaluate(e, env)));
    const ev = LA.eigSym(H).values;
    R.answer('H (numeric' + (String(v.pt).trim() ? ' at point' : ' at 0') + ')', H);
    R.check('eigenvalues', ev.map(x => fmtNum(x)).join(', '), { note: ev.every(x => x > 1e-10) ? 'all > 0 → positive definite (convex, bowl)' : ev.every(x => x < -1e-10) ? 'all < 0 → negative definite (concave)' : 'mixed/zero → indefinite / semi-definite' });
  },
});

tool({
  id: 'minmax1d', cat: 'calc', name: 'Local / Global minimum & maximum · argmin / argmax (1 variable)', short: 'Minimum / Maximum / argmin / argmax',
  kw: 'minimum maximum min max argmin argmax local global extremum optimization domain interval 최솟값 최댓값 극값',
  desc: 'max / min = <b>function VALUE</b> (output). argmax / argmin = the <b>INPUT x</b> that gives it. Domain examples: <code>[0, 1]</code>, <code>(0, 1]</code>, <code>(-inf, inf)</code> or <code>R</code>, finite set <code>{1, 2, 3}</code>.',
  inputs: [
    { k: 'f', type: 'expr', label: 'f(x)', def: 'x^3 - 6x^2 + 9x + 1', hint: EXPR_HINT, wide: true },
    { k: 'dom', type: 'text', label: 'domain', def: '[0, 5]', ph: '[a, b]  (a, b)  R  {1,2,3}' },
  ],
  solve(v, R) {
    const n = parseF(v.f);
    const xs = EX.varList(n);
    if (xs.length > 1) uerr(`f has several variables (${xs.join(', ')}). Use “Stationary points (multivariable)”.`);
    const x = xs[0] || 'x';
    const dom = parseDomain(v.dom);
    R.given('f', exprBox(n)).given('domain', dom.txt);
    R.find('local & global minimum/maximum: location (argmin/argmax) and value (min/max)');
    if (dom.kind === 'set') {
      const f = t => EX.evaluate(n, { [x]: t });
      const vals = dom.vals.map(t => ({ x: t, fx: f(t) }));
      R.table([x, `f(${x})`], vals.map(p => [p.x, p.fx]));
      const mx = Math.max(...vals.map(p => p.fx)), mn = Math.min(...vals.map(p => p.fx));
      R.answer('max f', mx).answer('argmax', vals.filter(p => Math.abs(p.fx - mx) < 1e-12).map(p => fmtNum(p.x)).join(', '));
      R.answer('min f', mn).answer('argmin', vals.filter(p => Math.abs(p.fx - mn) < 1e-12).map(p => fmtNum(p.x)).join(', '));
      return;
    }
    const A = analyze1D(n, x, dom);
    R.formula(`f′(${x}) = 0 (stationary points) + check endpoints`, 'f″ > 0 ⇒ local min, f″ < 0 ⇒ local max');
    if (A.dNode) R.step(`f′(${x})`, exprBox(A.dNode));
    if (A.d2Node) R.step(`f″(${x})`, exprBox(A.d2Node));
    if (A.constant) {
      R.answer('Result', 'f is constant → every x is both a global min and max', { sub: `f = ${fmtNum(A.f(0))}` });
      return;
    }
    if (!isFinite(dom.a) || !isFinite(dom.b)) R.note('Unbounded domain: critical points are found exactly for polynomials; otherwise searched on [−100, 100].', 'info');
    R.table(['x (argument)', 'f(x) (value)', 'type', 'reason'],
      A.pts.map(p => [p.x, p.fx, p.type, p.why]).concat(A.cands.filter(c => c.type === 'endpoint').map(c => [c.x, c.fx, 'endpoint (closed)', 'include in global comparison'])));
    if (!A.pts.length) R.note('No stationary point inside the domain.', 'info');
    const locMin = A.pts.filter(p => p.type === 'local min'), locMax = A.pts.filter(p => p.type === 'local max');
    locMin.forEach(p => R.answer('Local minimum', `${x} = <b>${fmtNum(p.x)}</b>, f(x) = <b>${fmtNum(p.fx)}</b>`));
    locMax.forEach(p => R.answer('Local maximum', `${x} = <b>${fmtNum(p.x)}</b>, f(x) = <b>${fmtNum(p.fx)}</b>`));
    const tol = 1e-9;
    const cv = A.cands.map(c => c.fx);
    const cMax = cv.length ? Math.max(...cv) : -Infinity, cMin = cv.length ? Math.min(...cv) : Infinity;
    let gmax = null, gmin = null, supNote = '', infNote = '';
    const endMax = A.ends.filter(e => e.lim > cMax + tol), endMin = A.ends.filter(e => e.lim < cMin - tol);
    const topMax = endMax.length ? Math.max(...endMax.map(e => e.lim)) : null;
    const topMin = endMin.length ? Math.min(...endMin.map(e => e.lim)) : null;
    if (endMax.length) supNote = endMax.filter(e => e.lim === topMax).map(e => e.lim === Infinity ? `f → +∞ as ${x} → ${fmtNum(e.at)}${isFinite(e.at) ? (e.side === 'left' ? '⁺' : '⁻') : ''}` : `sup = ${fmtNum(e.lim)} approached at the open end ${x} → ${fmtNum(e.at)} (not attained)`).join('; ');
    else if (cv.length) gmax = A.cands.filter(c => Math.abs(c.fx - cMax) < 1e-9 * Math.max(1, Math.abs(cMax)));
    if (endMin.length) infNote = endMin.filter(e => e.lim === topMin).map(e => e.lim === -Infinity ? `f → −∞ as ${x} → ${fmtNum(e.at)}${isFinite(e.at) ? (e.side === 'left' ? '⁺' : '⁻') : ''}` : `inf = ${fmtNum(e.lim)} approached at the open end ${x} → ${fmtNum(e.at)} (not attained)`).join('; ');
    else if (cv.length) gmin = A.cands.filter(c => Math.abs(c.fx - cMin) < 1e-9 * Math.max(1, Math.abs(cMin)));
    if (gmax) R.answer('Global max:  max f(x)  (VALUE)', cMax, { sub: `argmax = ${x} = <b>${gmax.map(c => fmtNum(c.x)).join(', ')}</b> (INPUT)` });
    else R.answer('Global max', '<b class="no">none (not attained)</b>', { sub: supNote || 'no candidate' });
    if (gmin) R.answer('Global min:  min f(x)  (VALUE)', cMin, { sub: `argmin = ${x} = <b>${gmin.map(c => fmtNum(c.x)).join(', ')}</b> (INPUT)` });
    else R.answer('Global min', '<b class="no">none (not attained)</b>', { sub: infNote || 'no candidate' });
    R.code(`import numpy as np\nx = np.linspace(${isFinite(dom.a) ? pyNum(dom.a) : -10}, ${isFinite(dom.b) ? pyNum(dom.b) : 10}, 100001)\nf = ${EX.str(n, true).replace(new RegExp('\\b' + x + '\\b', 'g'), 'x')}\ni_max, i_min = np.argmax(f), np.argmin(f)\nprint('max f =', f[i_max], ' argmax x =', x[i_max])\nprint('min f =', f[i_min], ' argmin x =', x[i_min])`);
  },
});

tool({
  id: 'setmax', cat: 'calc', name: 'Maximum (max) / argmax over a finite set 𝒜', short: 'Maximum / argmax on a set',
  kw: 'max argmax min argmin set finite discrete 집합',
  desc: 'max returns the highest VALUE f(a); argmax returns the ELEMENT a that achieves it. for example f(a) = 3a on [0,1] → max = 3, argmax = 1.',
  inputs: [
    { k: 'f', type: 'expr', label: 'f(a)', def: '3a', wide: true },
    { k: 'set', type: 'text', label: 'set 𝒜', def: '0, 0.5, 1' },
  ],
  solve(v, R) {
    const n = parseF(v.f);
    const x = EX.varList(n)[0] || 'a';
    const vals = parseList(v.set);
    const pts = vals.map(t => ({ a: t, f: EX.evaluate(n, { [x]: t }) }));
    R.given('f', exprBox(n)).given('𝒜', `{${vals.map(t => fmtNum(t)).join(', ')}}`);
    R.table([x, 'f'], pts.map(p => [p.a, p.f]));

    R.answer('min f(a)  (value)', mn, { sub: 'argmin = ' + pts.filter(p => p.f === mn).map(p => fmtNum(p.a)).join(', ') + ' (element)' });
  },
});

/* ---------- multivariable stationary points ---------- */
function stationary(n, xs) {
  const g = xs.map(x => EX.diff(n, x));
  const Hn = xs.map((a, i) => xs.map(b => EX.diff(g[i], b)));
  const ev = (nodes, p) => { const env = {}; xs.forEach((x, i) => (env[x] = p[i])); return nodes.map(e => (Array.isArray(e) ? e.map(q => EX.evaluate(q, env)) : EX.evaluate(e, env))); };
  const starts = [xs.map(() => 0), xs.map(() => 1), xs.map(() => -1)];
  let seed = 12345;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647) * 20 - 10;
  for (let k = 0; k < 60; k++) starts.push(xs.map(rnd));
  const found = [];
  for (const s of starts) {
    let p = s.slice();
    let ok = false;
    for (let it = 0; it < 100; it++) {
      const gv = ev(g, p);
      const gn = Math.hypot(...gv);
      if (!isFinite(gn)) break;
      if (gn < 1e-11) { ok = true; break; }
      const H = ev(Hn, p);
      const Hi = LA.inv(H) || LA.pinv(H);
      const step = LA.mul(Hi, LA.col(gv)).map(r => r[0]);
      let t = 1, np2;
      for (let bt = 0; bt < 30; bt++) {
        np2 = p.map((q, i) => q - t * step[i]);
        const g2 = Math.hypot(...ev(g, np2));
        if (isFinite(g2) && g2 < gn) break;
        t /= 2;
      }
      p = np2;
    }
    if (!ok) { const gn = Math.hypot(...ev(g, p)); ok = gn < 1e-8; }
    if (ok && !found.some(q => Math.hypot(...q.map((a, i) => a - p[i])) < 1e-6)) found.push(p.map(a => (Math.abs(a) < 1e-12 ? 0 : a)));
  }
  return found.map(p => {
    const H = ev(Hn, p);
    const e = LA.eigSym(H).values;
    let type;
    if (e.every(x => x > 1e-9)) type = 'local MIN (H positive definite)';
    else if (e.every(x => x < -1e-9)) type = 'local MAX (H negative definite)';
    else if (e.some(x => x > 1e-9) && e.some(x => x < -1e-9)) type = 'SADDLE point';
    else type = 'inconclusive (H semi-definite)';
    const env = {}; xs.forEach((x, i) => (env[x] = p[i]));
    return { p, fx: EX.evaluate(n, env), H, e, type };
  }).sort((a, b) => a.fx - b.fx);
}

tool({
  id: 'stationary', cat: 'calc', name: 'Stationary points / minimise f(x) (∇f = 0, multivariable)', short: '∇f = 0',
  kw: 'stationary critical point minimize minimise objective J(w) argmin gradient zero optimization multivariable saddle 최적화',
  desc: 'Solves ∇f = 0 and classifies each point with the Hessian. Works for any J(w) you type, for example <code>(w0+w1-1)^2 + (w0-w1)^2 + 0.1(w0^2+w1^2)</code>.',
  inputs: [
    { k: 'f', type: 'expr', label: 'f(x) or J(w)', def: 'x1^2 + x1*x2 + 2x2^2 - 4x1', hint: EXPR_HINT, wide: true },
    { k: 'vars', type: 'text', label: 'variables (optional order)', def: '' },
  ],
  solve(v, R) {
    const n = parseF(v.f);
    const xs = varsOf(n, v.vars);
    if (!xs.length) uerr('No variables found');
    R.given('f', exprBox(n)).given('variables', xs.join(', '));
    R.find('points where ∇f = 0, their type, and the minimum value vs. the minimising argument');
    R.formula('∇f = 0, then Hessian H: all eigenvalues > 0 ⇒ min, < 0 ⇒ max, mixed ⇒ saddle');
    xs.forEach(x => R.step(`∂f/∂${x}`, exprBox(EX.diff(n, x)), { note: '= 0' }));
    const pts = stationary(n, xs);
    if (!pts.length) { R.answer('Result', 'No stationary point found (f may be unbounded / linear).'); return; }
    R.table([...xs, 'f', 'Hessian eigenvalues', 'type'], pts.map(q => [...q.p, q.fx, q.e.map(z => fmtNum(z)).join(', '), q.type]));
    const mins = pts.filter(q => q.type.startsWith('local MIN'));
    const P = EX.toPoly(n);
    const quad = P && EX.polyDeg(P) <= 2;
    mins.forEach(q => R.answer('argmin (the INPUT)', q.p, { rowLabels: xs, sub: `min value f = <b>${fmtNum(q.fx)}</b> (the OUTPUT)${quad && mins.length === 1 ? ' — quadratic with Positive Definite (PD) Hessian ⇒ this is the GLOBAL minimum' : ''}` }));
    pts.filter(q => q.type.startsWith('local MAX')).forEach(q => R.answer('argmax (INPUT)', q.p, { rowLabels: xs, sub: `max value f = <b>${fmtNum(q.fx)}</b>` }));
    if (!mins.length && !pts.some(q => q.type.startsWith('local MAX'))) R.answer('Result', 'Stationary point(s) found but none is a min/max (see table).');
  },
});

tool({
  id: 'vecderiv', cat: 'calc', name: 'Vector–matrix derivative formulas (d(Ax)/dx …)', short: 'd(xᵀAx)/dx …',
  kw: 'vector matrix differentiation formula d(Ax)/dx d(b^T x)/dx x^T A x y^T A x gradient of J(w) normal equation',
  desc: 'd(Ax)/dx = A · d(bᵀx)/dx = b · d(xᵀAx)/dx = (A + Aᵀ)x · d(yᵀAx)/dx = Aᵀy · ∇J for J(w) = ‖Xw − y‖² + λ‖w‖².',
  inputs: [
    { k: 'which', type: 'select', label: 'formula', def: 'xAx', options: [['Ax', 'd(Ax)/dx = A'], ['bx', 'd(bᵀx)/dx = b'], ['xAx', 'd(xᵀAx)/dx = (A + Aᵀ)x'], ['yAx', 'd(yᵀAx)/dx = Aᵀy'], ['J', '∇J(w) = 2XᵀXw − 2Xᵀy + 2λw']] },
    { k: 'A', type: 'matrix', label: 'A (or X for ∇J)', def: [[1, 2], [3, 4]], group: 'm', showIf: r => r.which !== 'bx' },
    { k: 'b', type: 'vector', label: 'b', def: [1, 2], group: 'm', showIf: r => r.which === 'bx' },
    { k: 'x', type: 'vector', label: 'x (or w for ∇J)', def: [1, 1], group: 'm', showIf: r => ['xAx', 'J', 'bx', 'Ax'].includes(r.which) },
    { k: 'y', type: 'vector', label: 'y', def: [1, 0], group: 'm', showIf: r => ['yAx', 'J'].includes(r.which) },
    { k: 'lam', type: 'number', label: 'λ (for ∇J)', def: '0', showIf: r => r.which === 'J' },
  ],
  solve(v, R) {
    const { A, b, x, y } = v;
    switch (v.which) {
      case 'Ax': R.formula('d(Ax)/dx = A'); R.given('A', A); R.answer('d(Ax)/dx', A, { sub: `Jacobian, ${LA.dims(A)}` }); break;
      case 'bx': R.formula('d(bᵀx)/dx = b'); R.answer('d(bᵀx)/dx', b); break;
      case 'xAx': {
        R.formula('d(xᵀAx)/dx = (A + Aᵀ)x', 'if A is symmetric: 2Ax');
        const S2 = LA.add(A, LA.T(A));

   ===================================================================== */
tool({
  id: 'calc', cat: 'basic', name: 'Calculator 계산기 (소수 + 분수)', short: 'Calculator',
  kw: 'calculator 계산기 계산 arithmetic fraction 분수 decimal 소수 ans',
  live: true, solveLabel: 'Calculate',
  desc: '한 줄에 식 하나. 입력하면 바로 계산됩니다. 결과는 <b>소수</b>와 <b>분수/정확값</b>(2/3, √2/2, 3π/4 …)을 같이 보여줍니다. ' +
    '<code>a = 3/7</code> 처럼 변수 저장, <code>ans</code> = 바로 위 결과. 함수: sqrt, exp, ln, log10, sin/cos/tan (radian), abs, fact(5), nCr(5,2), nPr(5,2), pi, e.',
  inputs: [
    { k: 'lines', type: 'textarea', label: '계산식 (한 줄에 하나)', rows: 8, wide: true,
      def: '1/3 + 1/7\n(2/3)^2 - 0.25\nsqrt(8)/2\na = 3/4\nb = 5/6\na*b + ans\nnCr(10, 3) * 0.5^10',
      ph: '1/3 + 1/7\nsqrt(2)/2\na = 3/4\na^2 + ans' },
  ],
  solve(v, R) {
    const env = {};
    const rows = [];
    String(v.lines).split('\n').forEach((line0, i) => {
      const line = line0.replace(/#.*$/, '').trim().replace(/=\s*$/, '');
      if (!line) return;
      let name = null, src = line;
      const m = line.match(/^([A-Za-z_][A-Za-z0-9_]*)\s*=(?!=)\s*(.+)$/);
      if (m) {
        if (m[1] in { pi: 1, e: 1, ans: 1 } || EX.FUNCS[m[1]]) { rows.push({ line, err: `"${m[1]}" is a reserved name` }); return; }
        name = m[1]; src = m[2];
      }
      try {
        const n = EX.parse(src);
        const fenv = {}; for (const [k, o] of Object.entries(env)) fenv[k] = o.x;
        const x = EX.evaluate(n, fenv);
        if (typeof x !== 'number' || Number.isNaN(x)) uerr('result is not a real number (for example sqrt of a negative, 0/0, ln of ≤ 0)');
        if (!isFinite(x)) uerr('result is ±∞ (division by zero, or overflow)');
        const q = isFinite(x) ? exactEval(n, env) : null;
        const res = { x, q: q && Math.abs(Q.num(q) - x) <= 1e-9 * Math.max(1, Math.abs(x)) ? q : null };
        env.ans = res;
        if (name) env[name] = res;
        rows.push({ line, name, ...res });
      } catch (err) {
        rows.push({ line, err: err.message });
      }
    });
    if (!rows.length) uerr('Type a calculation, for example 1/3 + 1/7');
    const html = rows.map((r, i) =>
      `<div class="tape${r.err ? ' bad' : ''}">` +
      `<div class="tin"><span class="tno">${i + 1}</span><code>${esc(r.line)}</code></div>` +
      (r.err ? `<div class="tout err">${esc(r.err)}</div>` :
        `<div class="tout">${r.name ? `<span class="tname">${esc(r.name)} =</span>` : ''}${bothCell(r.x, r.q)}` +
        `<button class="copyb vis" onclick="copyText('${decStr(r.x)}', this)">copy</button></div>`) +
      '</div>').join('');
    R.text(`<div class="tapebox">${html}</div>`, 'answer');
  },
});

/* =====================================================================
   2) solve(equation, x)
   ===================================================================== */
tool({
  id: 'eqsolve', cat: 'basic', name: 'Solve equation for x  — like the Texas Instruments (TI-89) calculator solve(…, x)', short: 'Solve equation',
  kw: 'solve equation 방정식 근 root zero 해 풀기 ti89 texas instruments quadratic cubic 이차 삼차',
  live: true,
  desc: '① 식을 적고 ② 구하고 싶은 변수를 적으세요. 다항식은 정확한 근(분수, √)까지, 그 외(exp, ln, sin …)는 수치해를 찾습니다. ' +
    'Texas Instruments (TI-89) 계산기 형식 <code>solve(x^2-5x+6=0, x)</code> 를 그대로 붙여넣어도 됩니다.',
  inputs: [
    { k: 'eq', type: 'expr', label: '① 식 (equation)', def: '2x^2 - 3x - 2 = 0', ph: 'x^2 - 5x + 6 = 0', wide: true,
      hint: '"=" 가 없으면 <code>식 = 0</code> 으로 봅니다. ' + EXPR_HINT },
    { k: 'x', type: 'text', label: '② 구할 변수 (solve for)', def: 'x', ph: 'x' },
    { k: 'known', type: 'text', label: '다른 변수 값 (있으면)', def: '', ph: 'a=2, b=-1', optional: true },
    { k: 'range', type: 'text', label: '수치 탐색 범위 (비다항식만)', def: '-1000, 1000', ph: '-1000, 1000' },
  ],
  solve(v, R) {
    let src = String(v.eq).trim(), x = String(v.x || '').trim();
    const ti = src.match(/^solve\s*\(([\s\S]*),\s*([A-Za-z_][A-Za-z0-9_]*)\s*\)\s*$/i);
    if (ti) { src = ti[1]; x = ti[2]; }
    const e = parseEq(src, 'equation');
    const known = knownEnv(v.known);
    const g = subst(e.g, known);
    const left = EX.varList(g);
    if (!x) {
      if (left.length === 1) x = left[0];
      else if (left.includes('x')) x = 'x';
      else uerr(`② 구할 변수를 적어주세요 (식에 있는 변수: ${left.join(', ') || '없음'})`);
    }
    const others = left.filter(k => k !== x);
    if (others.length) uerr(`${others.join(', ')} 의 값이 필요합니다 → "다른 변수 값" 칸에 예: ${others.map(k => k + '=1').join(', ')}`);
    if (!left.includes(x)) {
      const val = EX.evaluate(g, {});
      R.given('equation', eqText(e));
      R.answer('Result', Math.abs(val) < 1e-12 ? '<b class="yes">항상 참 (identity) — every ' + esc(x) + ' works</b>' : `<b class="no">해 없음 — ${esc(x)} is not in the equation and the two sides differ by ${esc(decStr(val))}</b>`);
      return;
    }
    R.given('equation', `<code class="expr">${esc(eqText(e))}</code>`);
    if (Object.keys(known).length) R.given('known values', Object.entries(known).map(([k, a]) => `${k} = ${decStr(a)}`).join(', '));
    R.find(`all real ${esc(x)} with  ${esc(EX.str(e.L))} − (${esc(EX.str(e.R))}) = 0`);
    const f = t => EX.evaluate(g, { [x]: t });
    const sols = []; // {x, q?, ex?, mult?}
    const cplx = [];
    const P = EX.toPoly(g);
    const coeffs = P && EX.polyCoeffs(P, x);
    if (coeffs) {
      let c = coeffs.slice();
      const big = Math.max(...c.map(Math.abs), 1e-300);
      while (c.length > 1 && Math.abs(c[c.length - 1]) < 1e-13 * big) c.pop();
      const deg = c.length - 1;
      R.step('standard form', `<code class="expr">${esc(EX.str(EX.fromPoly(P)))} = 0</code>`, { note: `polynomial of degree ${deg}` });
      if (deg === 0) {
        R.answer('Result', Math.abs(c[0]) < 1e-12 ? `<b class="yes">항상 참 — every ${esc(x)} is a solution</b>` : `<b class="no">해 없음 (no solution): it reduces to ${esc(decStr(c[0]))} = 0</b>`);
        return;
      }
      let cq = exactPolyCoeffs(g, x, deg);
      if (cq && cq.some((q, i) => Math.abs(Q.num(q) - (c[i] || 0)) > 1e-9 * big)) cq = null;
      if (cq) cq = trimQ(cq);
      if (deg === 1) {
        R.formula('a·x + b = 0  ⇒  x = −b / a');
        const q = cq ? Q.div(Q.neg(cq[0]), cq[1]) : null;
        sols.push({ x: -c[0] / c[1], q });
        const qs = k => (cq ? Q.str(cq[k]).replace('-', '−') : decStr(c[k]));
        R.step('a, b', `${qs(1)}, ${qs(0)}`);
        R.step('x = −b/a', `−(${qs(0)}) / (${qs(1)})`);
      } else if (deg === 2) {
        R.formula('a·x² + b·x + c = 0  ⇒  x = (−b ± √(b² − 4ac)) / 2a');
        const [c0, c1, c2] = c, D = c1 * c1 - 4 * c2 * c0;
        R.step('a, b, c', `${decStr(c2)}, ${decStr(c1)}, ${decStr(c0)}`);
        R.step('discriminant D = b² − 4ac', D, { note: D > 1e-12 ? 'D > 0 → two real roots' : Math.abs(D) <= 1e-12 ? 'D = 0 → one repeated root' : 'D < 0 → no real roots (complex pair)' });
        if (cq) {
          const [a0, a1, a2] = cq;
          const Dq = Q.sub(Q.mul(a1, a1), Q.mul(Q.int(4), Q.mul(a2, a0)));
          const p = Q.div(Q.neg(a1), Q.mul(Q.int(2), a2));
          const s = qSqrt(Q.abs(Dq));
          const r = s && Q.abs(Q.div(s.r, Q.mul(Q.int(2), a2)));
          if (Q.isZero(Dq)) sols.push({ x: Q.num(p), q: p, mult: 2 });
          else if (Q.sign(Dq) > 0 && s.m === 1n) {
            [Q.sub(p, r), Q.add(p, r)].forEach(q => sols.push({ x: Q.num(q), q }));
          } else if (Q.sign(Dq) > 0) {
            [-1, 1].forEach(sg => sols.push({ x: Q.num(p) + sg * Q.num(r) * Math.sqrt(Number(s.m)), ex: pmStr(p, sg, surdStr(r, s.m)) }));
            R.step('exact roots', `${Q.isZero(p) ? '' : Q.str(p).replace('-', '−') + ' '}± ${surdStr(r, s.m)}`);
          } else {
            const im = s.m === 1n ? Q.str(r) : surdStr(r, s.m);
            [-1, 1].forEach(sg => cplx.push({ re: Q.num(p), im: sg * Q.num(r) * Math.sqrt(Number(s.m)), ex: pmStr(p, sg, im === '1' ? 'i' : `(${im})i`) }));
          }
        } else if (D >= -1e-12) {
          const sq = Math.sqrt(Math.max(0, D));
          if (sq === 0) sols.push({ x: -c1 / (2 * c2), mult: 2 });
          else [-1, 1].forEach(sg => sols.push({ x: (-c1 + sg * sq) / (2 * c2) }));
        } else {
          [-1, 1].forEach(sg => cplx.push({ re: -c1 / (2 * c2), im: (sg * Math.sqrt(-D)) / (2 * c2) }));
        }
      } else {
        R.formula('degree ≥ 3: rational-root theorem (exact) + numerical root finding for the rest');
        let restF = c;
        if (cq) {
          const rr = rationalRoots(cq);
          rr.roots.forEach(r => sols.push({ x: Q.num(r.q), q: r.q, mult: r.mult }));
          if (rr.roots.length) R.step('rational roots found', rr.roots.map(r => Q.str(r.q) + (r.mult > 1 ? ` (×${r.mult})` : '')).join(', '));
          restF = rr.rest.map(Q.num);
          if (rr.rest.length === 3) { // leftover quadratic → exact
            const [a0, a1, a2] = rr.rest;
            const Dq = Q.sub(Q.mul(a1, a1), Q.mul(Q.int(4), Q.mul(a2, a0)));
            const p = Q.div(Q.neg(a1), Q.mul(Q.int(2), a2));
            const s = qSqrt(Q.abs(Dq)), r = Q.abs(Q.div(s.r, Q.mul(Q.int(2), a2)));
            const root = Math.sqrt(Number(s.m));
            if (Q.sign(Dq) >= 0) [-1, 1].forEach(sg => sols.push({ x: Q.num(p) + sg * Q.num(r) * root, ex: s.m === 1n ? '' : pmStr(p, sg, surdStr(r, s.m)) }));
            else [-1, 1].forEach(sg => { const im = s.m === 1n ? Q.str(r) : surdStr(r, s.m); cplx.push({ re: Q.num(p), im: sg * Q.num(r) * root, ex: pmStr(p, sg, im === '1' ? 'i' : `(${im})i`) }); });
            restF = [];
          }
        }
        if (restF.length > 1) {
          for (const z of EX.polyRoots(restF)) {
            if (Math.abs(z.im) < 1e-7 * (1 + Math.abs(z.re))) {
              let t = z.re; // polish on the full polynomial
              const fp = s => c.reduce((a, ck, k) => a + ck * Math.pow(s, k), 0), dp = s => c.reduce((a, ck, k) => (k ? a + k * ck * Math.pow(s, k - 1) : a), 0);
              for (let i = 0; i < 30; i++) { const d = dp(t); if (!d) break; const nt = t - fp(t) / d; if (!isFinite(nt)) break; t = nt; }
              if (!sols.some(s => Math.abs(s.x - t) < 1e-7 * (1 + Math.abs(t)))) sols.push({ x: t });
            } else cplx.push({ re: z.re, im: z.im });
          }
        }
      }
    } else {
      R.formula('not a polynomial → numerical search: sign changes on a fine grid, then bisection + Newton');
      const m = String(v.range || '').split(/[,;\s]+/).filter(Boolean).map(EX.constVal);
      const lo = m.length === 2 ? Math.min(...m) : -1000, hi = m.length === 2 ? Math.max(...m) : 1000;
      R.step('search range', `[${decStr(lo)}, ${decStr(hi)}]`);
      numericRoots(f, lo, hi).forEach(t => sols.push({ x: t }));
    }
    sols.sort((a, b) => a.x - b.x);
    const exOf = s => (s.ex != null && s.ex !== '' ? s.ex : exactForm(s.x, s.q));
    if (!sols.length) {
      R.answer('Real solutions', `<b class="no">실수해 없음 (no real solution${coeffs ? '' : ' found in the range'})</b>`);
    } else {
      sols.forEach((s, i) => {
        const ex = exOf(s);
        R.answer(`${esc(x)}${sols.length > 1 ? sub(i + 1) : ''} =`, s.x, { sub: (ex ? `exact = <b class="mono">${esc(ex)}</b>` : Number.isInteger(+decStr(s.x)) && Math.abs(s.x - Math.round(s.x)) < 1e-12 ? 'exact integer' : 'decimal only') + (s.mult > 1 ? ` · repeated root (×${s.mult})` : '') });
      });
      R.answer('all solutions', `{ ${sols.map(s => decStr(s.x)).join(', ')} }`, { copy: sols.map(s => decStr(s.x)).join(', ') });
    }
    if (cplx.length) {
      R.text('<b>Complex roots (참고)</b>: ' + cplx.map(z => `<code>${esc(z.ex || `${decStr(z.re)} ${z.im < 0 ? '−' : '+'} ${decStr(Math.abs(z.im))}i`)}</code>`).join(', '), 'answer');
    }
    sols.forEach(s => {
      const l = EX.evaluate(subst(e.L, known), { [x]: s.x }), r = EX.evaluate(subst(e.R, known), { [x]: s.x });
      R.check(`${esc(x)} = ${decStr(s.x)}: Left-Hand Side (LHS) = ${decStr(l)}, Right-Hand Side (RHS) = ${decStr(r)}`, undefined, { note: Math.abs(l - r) < 1e-6 * Math.max(1, Math.abs(l), Math.abs(r)) ? '✓' : '✗ check' });
    });
    const knownPy = Object.entries(known).map(([k, a]) => `${k} = ${a}\n`).join('');
    const [ls, rs] = splitEq(src);
    R.code(`from sympy import *\n${x} = symbols('${x}')\n${knownPy}eq = Eq(${pyExpr(ls).trim()}, ${pyExpr(rs).trim()})\nsol = solve(eq, ${x})\nprint(sol)                      # exact\nprint([N(s, 10) for s in sol])  # decimal`);
  },
});

/* =====================================================================
   3) Simultaneous equations
   ===================================================================== */
tool({
  id: 'eqsystem', cat: 'basic', name: 'Simultaneous equations 연립방정식 (여러 변수)', short: '연립방정식',
  kw: 'simultaneous system equations 연립방정식 연립 linear nonlinear variables unknowns solve',
  live: true,
  desc: '한 줄에 방정식 하나. 변수는 자동으로 찾습니다. 선형이면 정확한 분수 해(가우스 소거, Reduced Row Echelon Form (RREF)) + 해 없음/무수히 많음 판별, ' +
    '비선형(x·y, x² …)이면 수치적으로 실수해를 찾습니다.',
  inputs: [
    { k: 'eqs', type: 'textarea', label: '방정식 (한 줄에 하나)', rows: 5, wide: true,
      def: '2x + 3y - z = 5\nx - y + 2z = 3\n3x + y + z = 10', ph: '2x + 3y = 7\nx - y = 1' },
    { k: 'vars', type: 'text', label: '구할 변수 (비우면 자동)', def: '', ph: 'x, y, z', optional: true },
    { k: 'known', type: 'text', label: '다른 변수 값 (있으면)', def: '', ph: 'a=2', optional: true },
  ],
  solve(v, R) {
    const lines = String(v.eqs).split(/\n|;/).map(s => s.replace(/#.*$/, '').trim()).filter(Boolean);
    if (!lines.length) uerr('Type at least one equation');
    const known = knownEnv(v.known);
    const eqs = lines.map((s, i) => { const e = parseEq(s, `equation ${i + 1}`); return { ...e, g: subst(e.g, known), src: s }; });
    const all = EX.natSort ? [...new Set(eqs.flatMap(e => EX.varList(e.g)))].sort(EX.natSort) : [...new Set(eqs.flatMap(e => EX.varList(e.g)))].sort();
    let xs = String(v.vars || '').trim() ? String(v.vars).split(/[,\s]+/).filter(Boolean) : all;
    const extra = all.filter(k => !xs.includes(k));
    if (extra.length) uerr(`${extra.join(', ')} 의 값이 필요합니다 → "다른 변수 값" 칸에 예: ${extra.map(k => k + '=1').join(', ')} (또는 "구할 변수"에 추가)`);
    if (!xs.length) uerr('No unknowns found');
    eqs.forEach((e, i) => R.given(`(${i + 1})`, `<code class="expr">${esc(eqText(e))}</code>`));
    R.given('unknowns', xs.join(', ') + `  (${eqs.length} equation${eqs.length > 1 ? 's' : ''}, ${xs.length} unknown${xs.length > 1 ? 's' : ''})`);
    R.find(`values of ${xs.join(', ')} that satisfy all equations`);
    const polys = eqs.map(e => EX.toPoly(e.g));
    const linear = polys.every(P => P && EX.polyDeg(P) <= 1);
    const checkAll = (sol, label) => eqs.forEach((e, i) => {
      const env = {}; xs.forEach((k, j) => (env[k] = sol[j]));
      const l = EX.evaluate(subst(e.L, known), env), r = EX.evaluate(subst(e.R, known), env);
      R.check(`${label}(${i + 1}) Left-Hand Side (LHS) = ${decStr(l)}, Right-Hand Side (RHS) = ${decStr(r)}`, undefined, { note: Math.abs(l - r) < 1e-6 * Math.max(1, Math.abs(l), Math.abs(r)) ? '✓' : '✗' });
    });

    if (linear) {
      // exact coefficients: c0 = g(0), a_j = g(e_j) − c0
      const zeroEnv = () => Object.fromEntries(xs.map(k => [k, { q: Q.int(0) }]));
      let exact = true;
      const rowsQ = eqs.map(e => {
        const c0 = exactEval(e.g, zeroEnv());
        if (!c0) { exact = false; return null; }
        const row = xs.map(k => { const env = zeroEnv(); env[k] = { q: Q.int(1) }; const y = exactEval(e.g, env); if (!y) { exact = false; return null; } return Q.sub(y, c0); });
        return exact ? row.concat([Q.neg(c0)]) : null;
      });
      const F = exact ? FIELD_Q : FIELD_F;
      const M = exact ? rowsQ : eqs.map(e => {
        const z = Object.fromEntries(xs.map(k => [k, 0])), c0 = EX.evaluate(e.g, z);
        return xs.map(k => EX.evaluate(e.g, { ...z, [k]: 1 }) - c0).concat([-c0]);
      });
      R.formula('linear system A·x = b  →  Gaussian elimination to Reduced Row Echelon Form (RREF) of [A | b]', exact ? 'exact fraction arithmetic' : 'floating point (π, e, √ in coefficients)');
      R.text('<b>Augmented matrix [A | b]</b>' + augTable(M, xs, F));
      const { M: Rm, piv } = rref(M, F);
      R.text('<b>Reduced Row Echelon Form (RREF)</b>' + augTable(Rm, xs, F));
      const n = xs.length;
      const incons = Rm.some(r => r.slice(0, n).every(F.isZero) && !F.isZero(r[n]));
      R.step('rank(A)', piv.length, { note: `rank([A|b]) = ${incons ? piv.length + 1 : piv.length}, unknowns = ${n}` });
      if (incons) {
        R.answer('Result', '<b class="no">해 없음 (no solution) — inconsistent</b>', { sub: 'a row of Reduced Row Echelon Form (RREF) reads 0 = (non-zero), that is, rank(A) < rank([A|b])' });
        return;
      }
      if (piv.length === n) {
        const sol = xs.map((_, j) => Rm[piv.indexOf(j)][n]);
        xs.forEach((k, j) => {
          const val = F.num(sol[j]);
          R.answer(`${esc(k)} =`, val, { sub: bothSub(val, exact ? sol[j] : null) });
        });
        R.answer('(' + xs.join(', ') + ')', `(${sol.map(s => decStr(F.num(s))).join(', ')})`, { copy: sol.map(s => decStr(F.num(s))).join(', ') });
        checkAll(sol.map(F.num), '');
      } else {
        const free = xs.filter((_, j) => !piv.includes(j));
        R.answer('Result', '<b>해가 무수히 많음 (infinitely many solutions)</b>', { sub: `free variable${free.length > 1 ? 's' : ''}: ${free.join(', ')} (아무 값이나 가능)` });
        piv.forEach((c, r) => {
          let s = F.str(Rm[r][n]);
          let first = F.isZero(Rm[r][n]);
          if (first) s = '';
          xs.forEach((k, j) => {
            if (j === c || piv.includes(j) || F.isZero(Rm[r][j])) return;
            const co = F.num(Rm[r][j]); // move to the right: −co·k
            const mag = F.str(exact ? Q.abs(Rm[r][j]) : Math.abs(co));
            const term = `${mag === '1' ? '' : mag}${k}`;
            s += first ? (co > 0 ? '−' : '') + term : (co > 0 ? ' − ' : ' + ') + term;
            first = false;
          });
          R.answer(`${esc(xs[c])} =`, `<span class="mono">${esc(s || '0')}</span>`);
        });
        free.forEach(k => R.answer(`${esc(k)} =`, `<span class="mono">${esc(k)}</span>`, { sub: 'free (any real number)' }));
      }
      const A = M.map(r => r.slice(0, n).map(F.num)), b = M.map(r => F.num(r[n]));
      R.code(`import numpy as np\nA = ${pyArr(A)}\nb = ${pyArr(b)}\n${eqs.length === n && piv.length === n ? 'x = np.linalg.solve(A, b)' : 'x = np.linalg.pinv(A) @ b   # one solution (min-norm / least squares)'}\nprint(x)\n\n# exact fractions:\nfrom sympy import symbols, Eq, solve, Rational\n${xs.join(', ')} = symbols('${xs.join(' ')}')\nprint(solve([${lines.map(s => { const [l, r] = splitEq(s); return `Eq(${pyExpr(l).trim()}, ${pyExpr(r).trim()})`; }).join(', ')}], [${xs.join(', ')}]))`);
      return;
    }

    // ---------- nonlinear: Levenberg–Marquardt from many starting points ----------
    R.formula('nonlinear system → Newton / Levenberg–Marquardt from many starting points', 'numerical: finds real solutions; exact forms recognised when simple');
    const n = xs.length, m = eqs.length;
    const G = p => { const env = {}; xs.forEach((k, j) => (env[k] = p[j])); return eqs.map(e => EX.evaluate(e.g, env)); };
    const safeG = p => { try { const r = G(p); return r.every(isFinite) ? r : null; } catch (e) { return null; } };
    const nrm = r => Math.sqrt(r.reduce((s, x) => s + x * x, 0));
    let seed = 12345;
    const rnd = () => { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; };
    const found = [];
    const starts = [Array(n).fill(0), Array(n).fill(1), Array(n).fill(-1)];
    for (const sc of [1, 3, 10, 50]) for (let k = 0; k < 80; k++) starts.push(Array.from({ length: n }, () => (rnd() * 2 - 1) * sc));
    for (const p0 of starts) {
      let p = p0.slice(), r = safeG(p);
      if (!r) continue;
      let mu = 1e-3;
      for (let it = 0; it < 120; it++) {
        const J = Array.from({ length: m }, () => Array(n).fill(0));
        let ok = true;
        for (let j = 0; j < n; j++) {
          const hh = 1e-7 * Math.max(1, Math.abs(p[j]));
          const pp = p.slice(), pm = p.slice(); pp[j] += hh; pm[j] -= hh;
          const a = safeG(pp), b = safeG(pm);
          if (!a || !b) { ok = false; break; }
          for (let i = 0; i < m; i++) J[i][j] = (a[i] - b[i]) / (2 * hh);
        }
        if (!ok) break;
        const JtJ = Array.from({ length: n }, (_, a) => Array.from({ length: n }, (_, b) => J.reduce((s, row) => s + row[a] * row[b], 0)));
        const Jtr = Array.from({ length: n }, (_, a) => J.reduce((s, row, i) => s + row[a] * r[i], 0));
        let improved = false;
        for (let tries = 0; tries < 8; tries++) {
          const Ad = JtJ.map((row, a) => row.map((x, b) => (a === b ? x + mu * (1 + x) : x)));
          const d = gaussSolve(Ad, Jtr.map(x => -x));
          if (!d) { mu *= 10; continue; }
          const pn = p.map((x, j) => x + d[j]), rn = safeG(pn);
          if (rn && nrm(rn) < nrm(r)) { p = pn; r = rn; mu = Math.max(mu / 10, 1e-12); improved = true; break; }
          mu *= 10;
        }
        if (!improved || nrm(r) < 1e-14) break;
      }
      if (nrm(r) < 1e-9 && p.every(x => Math.abs(x) < 1e8)) {
        const clean = p.map(x => (Math.abs(x) < 1e-11 ? 0 : x));
        if (!found.some(q => q.every((x, j) => Math.abs(x - clean[j]) < 1e-6 * Math.max(1, Math.abs(x))))) found.push(clean);
      }
    }
    found.sort((a, b) => { for (let j = 0; j < n; j++) if (Math.abs(a[j] - b[j]) > 1e-9) return a[j] - b[j]; return 0; });
    if (!found.length) {
      R.answer('Result', '<b class="no">실수해를 찾지 못함 (no real solution found)</b>', { sub: 'the system may have no real solution, or only very large ones' });
      return;
    }
    if (m < n) R.note(`방정식(${m}) < 변수(${n}) → 보통 해가 무수히 많습니다. 아래는 그중 찾은 몇 개입니다.`, 'warn', 'answer');
    found.slice(0, 12).forEach((s, i) => {
      R.answer(`Solution ${i + 1}${found.length > 1 ? ` of ${Math.min(found.length, 12)}` : ''}`,
        `<span class="mono">${s.map((x, j) => `${esc(xs[j])} = ${bothCell(x, null)}`).join('<br>')}</span>`,
        { copy: s.map((x, j) => `${xs[j]} = ${decStr(x)}`).join(', ') });
    });
    found.slice(0, 12).forEach((s, i) => checkAll(s, `sol ${i + 1}: `));
    R.code(`from sympy import symbols, Eq, solve, N\n${xs.join(', ')} = symbols('${xs.join(' ')}')\nsols = solve([${lines.map(s => { const [l, r] = splitEq(s); return `Eq(${pyExpr(l).trim()}, ${pyExpr(r).trim()})`; }).join(', ')}], [${xs.join(', ')}], dict=True)\nfor s in sols:\n    print(s, {k: N(v, 10) for k, v in s.items()})`);
  },
});

'use strict';
/* =====================================================================
   tools_reg.js — Linear regression, multi-output, classification,
   ridge, polynomial  (all share fitModel)
   ===================================================================== */

/* ---------- every error / loss quantity, named the way exam questions name it ----------
   e = residuals ŷ − y (flattened), o = { m (samples), h (outputs), lam, wsq (wᵀw) } */
function errorTerms(R, e, o = {}) {
  const m = o.m ?? e.length, h = o.h || 1, n = e.length;
  const sse = e.reduce((s, x) => s + x * x, 0), mse = sse / m;
  const list = f => e.slice(0, 20).map((x, i) => f(x, i)).join('<br>') + (e.length > 20 ? '<br>…' : '');
  const rows = [
    { star: true, q: 'Squared error loss (of the whole data set) · Sum of Squared Errors (SSE) · Residual Sum of Squares (RSS)',
      ko: '오차 제곱의 <b>합</b> — m으로 <b>나누지 않음</b>. Lecture 5 slide 17: “this choice of the loss function is called squared error loss”.<br>' +
        '⚠ <b>cost function · objective function · J(w)</b> 는 강의에 두 정의가 있음: slide 17 = 이 합 (기본), slide 16 = (1/m) 을 붙인 평균 → 문제의 식에 1/m 이 있으면 아래 MSE 줄',
      f: h > 1 ? 'Σᵢ Σₖ (ŷᵢₖ − yᵢₖ)² = trace(EᵀE)' : 'Σᵢ (ŷᵢ − yᵢ)² = eᵀe = (Xw − y)ᵀ(Xw − y)', v: sse },
    { star: true, q: 'Mean Squared Error (MSE) · mean of squared error · average squared error',
      ko: `오차 제곱의 <b>평균</b> — 합(SSE)을 샘플 수 m = ${m} 으로 나눔.<br>` +
        '조건부로 같은 말: <b>average loss</b> (loss 가 squared error 일 때) · <b>empirical risk</b> (학습 데이터에서 계산할 때, Lecture 5 slide 18) · ' +
        `<b>(1/m)·J(w)</b> (${o.lam > 0 ? '<b>지금은 ridge 라서 다름</b> — 벌점이 빠진 값' : 'ridge 벌점이 없을 때'})`, f: `(1/m) Σ (ŷᵢ − yᵢ)² = ${fmtNum(sse)} / ${m}`, v: mse },
    h > 1 ? { q: 'Mean Squared Error over every entry (sklearn mean_squared_error default for several outputs)', ko: `모든 칸 m × h = ${n} 개로 나눔`, f: `SSE / ${n}`, v: sse / n } : null,
    { q: 'Root Mean Squared Error (RMSE)', ko: 'Mean Squared Error (MSE) 의 제곱근', f: '√MSE', v: Math.sqrt(mse) },
    { q: 'Mean Absolute Error (MAE) — not in the lecture', ko: '오차 절댓값의 평균', f: '(1/m) Σ |ŷᵢ − yᵢ|', v: e.reduce((s, x) => s + Math.abs(x), 0) / m },
  ];
  if (h === 1) {
    rows.push({ q: 'Squared error loss of ONE sample i · loss function Lᵢ · penalty for sample i', ko: '샘플 하나의 오차 제곱 (Lecture 5 slide 16)', f: 'Lᵢ = (ŷᵢ − yᵢ)²', v: list((x, i) => `L${sub(i + 1)} = ${fmtNum(x * x)}`) });
    rows.push({ q: 'Residual · error eᵢ · prediction error', ko: '예측값 − 실제값 (책에 따라 yᵢ − ŷᵢ 로 부호만 반대, 제곱하면 같음)', f: 'eᵢ = ŷᵢ − yᵢ', v: list((x, i) => `e${sub(i + 1)} = ${fmtNum(x)}`) });
  }
  if (o.lam > 0) {
    const pen = o.lam * o.wsq;
    rows.push({ q: 'Regularization term · penalty term · λ‖w‖² = λwᵀw', ko: 'ridge 의 벌점 항 (w₀ 포함 모든 w)', f: `${fmtNum(o.lam)} × ${fmtNum(o.wsq)}`, v: pen });
    rows.push({ star: true, q: 'Ridge objective · ridge cost function · regularized (penalized) loss · J(w) = SSE + λwᵀw', ko: '오차 제곱 합 + 벌점', f: `${fmtNum(sse)} + ${fmtNum(pen)}`, v: sse + pen });
    rows.push({ q: 'Squared L2 norm of w · ‖w‖² = wᵀw', ko: 'w 원소 제곱의 합', v: o.wsq });
  }
  R.terms(rows);
  return { sse, mse };
}

function classTerms(R, correct, m, e, what, h = 1) {
  const sse = e.reduce((s, x) => s + x * x, 0);
  R.terms([
    { star: true, q: 'Training accuracy · classification accuracy · fraction correctly classified', ko: `맞힌 개수 / 전체 = ${correct} / ${m}`, f: `${correct} / ${m} = ${fmtNum((100 * correct) / m, { dec: 2 })}%`, v: correct / m },
    { q: 'Number of correctly classified samples', ko: '맞힌 샘플 수', v: correct },
    { q: 'Number of misclassified samples · misclassifications', ko: '틀린 샘플 수', v: m - correct },
    { q: 'Misclassification rate · error rate · classification error', ko: '틀린 비율 = 1 − accuracy', f: `${m - correct} / ${m}`, v: (m - correct) / m },
    { q: `Squared error loss of the linear scores · Sum of Squared Errors (SSE) (${what})`, ko: '분류 전 점수(score)와 정답 사이의 오차 제곱 합 — 학습이 최소화한 값', f: h > 1 ? 'trace(EᵀE), E = XŴ − Y' : 'Σ (xᵢᵀŵ − yᵢ)²', v: sse },
    { q: 'Mean Squared Error (MSE) of the linear scores', ko: '위 합을 m 으로 나눔', f: `SSE / ${m}`, v: sse / m },
  ], '문제에서 이렇게 물으면 → 이 값을 쓰세요 (training data, question wording → value)');
}

/* ---------- the shared fit / predict engine ----------
   o = { Xraw, Y (m×h), bias, lambda, mode, deg, order, task: 'reg'|'bin'|'multi',
         Xnew (raw) | null, binInfo {pos,neg}, classes, yNames } */
function fitModel(o, R) {
  const { Xraw, Y } = o;
  const m = Xraw.length;
  legend(R, [o.deg ? 'P' : 'X', Y[0].length > 1 ? 'Y' : 'y', 'wh', 'yh', ...(o.Xnew ? ['Xn'] : []), 'm', 'd', ...(o.task === 'multi' ? ['C'] : []), ...(o.lambda > 0 ? ['lam', 'I'] : [])]);
  if (Y.length !== m) uerr(`X has ${m} rows (samples) but the target has ${Y.length} — one target per sample.`);
  const h = Y[0].length;
  const d0 = Xraw[0].length;
  let D, labels, Dn = 'X', biasIncluded = false;
  if (o.deg && o.deg >= 1) {
    const pe = polyExpand(Xraw, o.deg, o.order);
    D = pe.P; labels = pe.labels; Dn = 'P'; biasIncluded = true;
    R.step(`Polynomial feature matrix P (order ${o.deg}${d0 > 1 ? `, ${o.order === 'lecture' ? 'lecture' : 'sklearn'} column order` : ''})`, D, { colLabels: labels, note: `${m}×${labels.length}: ${labels.length} parameters = C(d+p, p) = C(${d0}+${o.deg}, ${o.deg})` });
  } else {
    const dm = designMatrix(Xraw, o.bias, R);
    D = dm.X; biasIncluded = o.bias;
    const names = featNames(d0);
    labels = o.bias ? (dm.already ? ['1', ...featNames(d0 - 1)] : ['1', ...names]) : names;
    R.step(o.bias ? (dm.added ? 'Design matrix X = [1, x] (bias column of 1s added)' : 'Design matrix X') : 'X (no bias)', D, { colLabels: labels });
  }
  const [mm, dd] = LA.shape(D);
  const st = sysType(mm, dd);
  const lam = o.lambda || 0;
  const form = lam > 0 ? (o.mode === 'dual' || (o.mode !== 'primal' && mm < dd) ? 'Ridge DUAL' : 'Ridge PRIMAL') : mm === dd ? (LA.isInvertible(D) ? 'square: inverse' : 'square singular') : mm > dd ? 'least squares (primal / left inverse)' : 'constrained min-norm (dual / right inverse)';
  const taskName = { reg: h > 1 ? 'Linear regression with MULTIPLE outputs' : 'Linear regression (training)', bin: 'Binary classification (linear regression + sign)', multi: 'Multi-category classification (one-hot + argmax)' }[o.task];
  R.detect(`${o.deg ? `Polynomial (order ${o.deg}) · ` : ''}${taskName} · ${Dn} is ${mm}×${dd} → ${st.short} · ${lam > 0 ? `λ = ${fmtNum(lam)} → ` : ''}<b>${form}</b>`);
  const res = lsqSolve(D, Y, R, { lambda: lam, mode: o.mode, Xn: Dn, yn: h > 1 ? 'Y' : 'y' });
  const W = res.W;
  // parameter labels
  const pl = labels.map((l, i) => (biasIncluded ? `w${sub(i)}` : `w${sub(i + 1)}`) + (l === '1' ? ' (bias)' : ` [${l}]`));
  if (h === 1) {
    const w = W.map(r => r[0]);
    R.answer(`Learned parameters ŵ = argmin J(w) ${lam > 0 ? '(ridge)' : '(least squares solution · weights · coefficients)'}`, w, { rowLabels: pl, copy: '[' + w.map(t => fmtNum(t)).join(', ') + ']' });
    if (biasIncluded) R.answer('Intercept / bias w₀', w[0], { sub: `feature coefficients: ${labels.slice(1).map((l, i) => `${l}: ${fmtNum(w[i + 1])}`).join(', ')}` });
    if (o.task !== 'multi') R.answer('Fitted model', modelEquation(w, labels, o.task === 'bin' ? 'score' : 'ŷ'));
  } else {
    const cl = o.task === 'multi' ? o.classes.map(c => clsName(c)) : Array.from({ length: h }, (_, k) => `y${sub(k + 1)}`);
    R.answer(`Ŵ (${dd}×${h})`, W, { rowLabels: pl, colLabels: cl, sub: o.task === 'multi' ? 'column k = score model of class k' : 'column k = model for output k' });
  }
  // training fit
  const F = LA.mul(D, W);
  if (o.task === 'reg') {
    const E = LA.sub(F, Y);
    const sse = E.flat().reduce((s, x) => s + x * x, 0);
    if (h === 1) R.table(['i', 'yᵢ (actual)', 'ŷᵢ = xᵢᵀŵ', 'eᵢ = ŷᵢ − yᵢ', 'eᵢ²', 'over / under'], Y.map((r, i) => [i + 1, r[0], F[i][0], E[i][0], E[i][0] ** 2, overUnder(E[i][0])]), 'check');
    R.check(`J(ŵ) = Σ(ŷᵢ − yᵢ)² = eᵀe ${h > 1 ? '(trace(EᵀE))' : ''}`, sse, { note: `Mean Squared Error (MSE) = J/m = ${fmtNum(sse / m)}${res.exact ? '  → exact fit (ŷ = y)' : ''}` });
    if (res.exact) R.note('Exact fit: ŷ = y on every training sample, so every error below is 0.', 'info', 'answer');
    errorTerms(R, E.flat(), { m, h, lam, wsq: W.flat().reduce((s, x) => s + x * x, 0) });
    if (lam > 0) { const pen = lam * W.flat().reduce((s, x) => s + x * x, 0); R.check('penalty λ‖ŵ‖²', pen, { note: `J_ridge = ${fmtNum(sse + pen)}` }); }
  } else if (o.task === 'bin') {
    const pred = F.map(r => sgn(r[0]));
    const acc = pred.filter((p, i) => p === Y[i][0]).length;
    R.table(['i', 'score xᵢᵀŵ', 'sign → class', 'true'], F.map((r, i) => [i + 1, r[0], `${pred[i] > 0 ? '+1' : '−1'} (${pred[i] > 0 ? o.binInfo.pos : o.binInfo.neg})`, Y[i][0] > 0 ? `+1 (${o.binInfo.pos})` : `−1 (${o.binInfo.neg})`]), 'check');
    R.check('training accuracy', `${acc}/${m}`);
    classTerms(R, acc, m, LA.sub(F, Y).flat(), 'scores xᵢᵀŵ vs labels ±1');
  } else if (o.task === 'multi') {
    const am = F.map(r => r.indexOf(Math.max(...r)));
    const tr = Y.map(r => r.indexOf(1));
    R.check('training accuracy', `${am.filter((a, i) => a === tr[i]).length}/${m}`);
    classTerms(R, am.filter((a, i) => a === tr[i]).length, m, LA.sub(F, Y).flat(), 'score matrix XŴ vs one-hot Y', Y[0].length);
  }
  // prediction
  let pred = null;
  if (o.Xnew) {
    if (o.Xnew[0].length !== d0) uerr(`X_new has ${o.Xnew[0].length} feature column(s) but training X has ${d0}. Enter RAW features (the same columns as training X${o.deg ? ', before polynomial expansion' : ''}).`);
    let Dnew, nm = 'X_new';
    if (o.deg) { Dnew = polyExpand(o.Xnew, o.deg, o.order).P; nm = 'P_new'; R.note('X_new is expanded with the SAME polynomial terms as training.', 'info', 'answer'); }
    else if (biasIncluded && D[0].length === d0 + 1) Dnew = addBias(o.Xnew);
    else Dnew = o.Xnew;
    R.answer(`${nm} ${biasIncluded && !o.deg ? '(1 prepended to every new sample)' : ''}`, Dnew, { colLabels: labels });
    const Yn = LA.mul(Dnew, W, nm, 'ŵ');
    if (o.task === 'reg') {
      R.answer(`Prediction ŷ_new = ${nm}·ŵ  (predicted output · estimated y · test output)`, h === 1 ? Yn.map(r => r[0]) : Yn, { colLabels: h > 1 ? Array.from({ length: h }, (_, k) => `y${sub(k + 1)}`) : undefined });
    } else if (o.task === 'bin') {
      const rows = Yn.map((r, i) => {
        const s = r[0], c = sgn(s);
        return [i + 1, o.Xnew[i].map(t => fmtNum(t)).join(', '), `<b>${fmtNum(s)}</b>`, `sign(${fmtNum(s)}) = ${c > 0 ? '+1' : '−1'}`, `<b>${c > 0 ? '+1' : '−1'} → ${esc(c > 0 ? o.binInfo.pos : o.binInfo.neg)}</b>`];
      });
      R.text('Step 1 — linear output (score): same calculation as linear regression. Step 2 — apply sign (score ≥ 0 → +1, score < 0 → −1).', 'answer');
      R.table(['#', 'x_new', 'score = x_newᵀŵ', 'sign', 'Final class'], rows, 'answer');
      pred = Yn.map(r => sgn(r[0]));
      R.answer('Predicted classes', pred.map((c, i) => `${c > 0 ? '+1' : '−1'} (${esc(c > 0 ? o.binInfo.pos : o.binInfo.neg)})`).join(', '));
    } else {
      const rows = Yn.map((r, i) => {
        const k = r.indexOf(Math.max(...r));
        return [i + 1, o.Xnew[i].map(t => fmtNum(t)).join(', '), r.map((s, j) => (j === k ? `<b>${fmtNum(s)}</b>` : fmtNum(s))).join(', '), `largest = ${fmtNum(r[k])} in column ${k + 1}`, `<b>${esc(clsName(o.classes[k]))}</b>`];
      });
      R.answer('Ŷ_new = X_new·Ŵ (class scores)', Yn, { colLabels: o.classes.map(c => clsName(c)), hl: (i, j) => Yn[i][j] === Math.max(...Yn[i]) });
      R.table(['#', 'x_new', 'scores [Class 1 … C]', 'argmax', 'Predicted class'], rows, 'answer');
      R.answer('Predicted classes', Yn.map(r => clsName(o.classes[r.indexOf(Math.max(...r))])).join(', '));
    }
    pred = Yn;
  }
  return { W, D, labels, res, pred };
}

function fitCode(o) {
  const L = ['import numpy as np', 'from numpy.linalg import inv'];
  if (o.deg) L.push('from sklearn.preprocessing import PolynomialFeatures');
  L.push(`X = ${pyArr(o.Xraw)}`);
  if (o.task === 'multi') L.push(`Y = ${pyArr(o.Y)}   # one-hot targets (columns = classes ${o.classes.join(', ')})`);
  else if (o.Y[0].length > 1) L.push(`Y = ${pyArr(o.Y)}`);
  else L.push(`y = ${pyArr(o.Y.map(r => r[0]))}${o.task === 'bin' ? `   # +1 = ${o.binInfo.pos}, -1 = ${o.binInfo.neg}` : ''}`);
  const yv = o.task === 'multi' || o.Y[0].length > 1 ? 'Y' : 'y';
  let M = 'X';
  if (o.deg) { L.push(`poly = PolynomialFeatures(${o.deg})`, 'P = poly.fit_transform(X)' + (o.order === 'lecture' && o.Xraw[0].length > 1 ? '   # NOTE: sklearn column order differs from lecture order' : '')); M = 'P'; }
  else if (o.bias) L.push('X = np.hstack((np.ones((X.shape[0], 1)), X))   # add bias column of 1s');
  const lam = o.lambda || 0;
  const [mm, dd] = [o.Xraw.length, o.deg ? polyTerms(o.Xraw[0].length, o.deg).length : o.Xraw[0].length + (o.bias ? 1 : 0)];
  const dual = lam > 0 ? o.mode === 'dual' || (o.mode !== 'primal' && mm < dd) : mm < dd;
  if (lam > 0) {
    L.push(`lam = ${pyNum(lam)}`);
    L.push(dual ? `w = ${M}.T @ inv(${M} @ ${M}.T + lam * np.identity(${M}.shape[0])) @ ${yv}   # ridge dual (m < d)` : `w = inv(${M}.T @ ${M} + lam * np.identity(${M}.shape[1])) @ ${M}.T @ ${yv}   # ridge primal`);
  } else if (mm === dd) L.push(`w = inv(${M}) @ ${yv}   # square & invertible`);
  else L.push(dual ? `w = ${M}.T @ inv(${M} @ ${M}.T) @ ${yv}   # under-determined: right inverse` : `w = inv(${M}.T @ ${M}) @ ${M}.T @ ${yv}   # least squares`);
  L.push('print(w)');
  if (o.Xnew) {
    L.push(`Xnew = ${pyArr(o.Xnew)}`);
    if (o.deg) L.push('Pnew = poly.fit_transform(Xnew)');
    else if (o.bias) L.push('Xnew = np.hstack((np.ones((Xnew.shape[0], 1)), Xnew))');
    const Mn = o.deg ? 'Pnew' : 'Xnew';
    L.push(`y_new = ${Mn} @ w`, 'print(y_new)');
    if (o.task === 'bin') L.push('print(np.sign(y_new))   # careful: np.sign(0) = 0; EE2211 uses score >= 0 -> +1');
    if (o.task === 'multi') L.push(`print(np.argmax(y_new, axis=1) + 1)   # predicted class index (1-based)`);
  }
  return L.join('\n');
}

tool({
  id: 'lrloss', cat: 'linreg', name: 'Loss · Cost · Objective J(w) for a given w', short: 'Loss / J(w)',
  kw: 'loss function cost objective J(w) squared error residual empirical risk Mean Squared Error (MSE) sum of squares evaluate w 손실 목적함수 비용',
  desc: 'Loss (one sample): Lᵢ = (xᵢᵀw − yᵢ)². Cost / objective: J(w) = Σᵢ Lᵢ = (Xw − y)ᵀ(Xw − y). Mean form: (1/m)Σ. Ridge adds λwᵀw.',
  inputs: [XIN([[-9], [-7], [-5], [1], [5], [9]]), YIN([-6, -6, -4, -1, 1, 4]), BIAS,
    { k: 'w', type: 'vector', label: 'w (the parameters to evaluate)', def: [-1.4375, 0.5625] },
    { k: 'lam', type: 'number', label: 'λ (0 = no ridge penalty)', def: '0' }],
  solve(v, R) {
    const dm = designMatrix(v.X, v.bias, R);
    const X = dm.X, y = v.y, w = v.w;
    if (X[0].length !== w.length) uerr(`w has ${w.length} entries but X${v.bias ? ' (with bias)' : ''} has ${X[0].length} columns.`);
    if (X.length !== y.length) uerr('X rows and y length differ');
    R.given('X', X).given('y', y).given('w', w);
    R.find('predictions, residuals, loss per sample, J(w), and the Mean Squared Error (MSE)');
    R.formula('eᵢ = xᵢᵀw − yᵢ,  Lᵢ = eᵢ²,  J(w) = Σ Lᵢ = eᵀe = (Xw − y)ᵀ(Xw − y)' + (v.lam ? ' + λwᵀw' : ''));
    const yh = X.map(r => LA.dot(r, w)), e = yh.map((t, i) => t - y[i]), L = e.map(t => t * t);
    R.table(['i', 'xᵢ', 'ŷᵢ = xᵢᵀw', 'yᵢ', 'eᵢ = ŷᵢ − yᵢ', 'Lᵢ = eᵢ²', 'over / under'], X.map((r, i) => [i + 1, '[' + r.map(t => fmtNum(t)).join(', ') + ']', yh[i], y[i], e[i], L[i], overUnder(e[i])]));
    const J = NUM.sum(L);
    R.step('Xw (predictions)', yh).step('e = Xw − y', e);
    errorTerms(R, e, { m: y.length, lam: v.lam || 0, wsq: LA.dot(w, w) });
    R.check('eᵀe (matrix form)', LA.dot(e, e));
    R.code(`import numpy as np\nX = ${pyArr(X)}\ny = ${pyArr(y)}\nw = ${pyArr(w)}\ne = X @ w - y\nJ = e @ e          # sum of squared errors\nprint(J, J / len(y))  # J and MSE${v.lam ? `\nprint(J + ${pyNum(v.lam)} * w @ w)   # ridge objective` : ''}`);
  },
});

tool({
  id: 'normaleq', cat: 'linreg', name: 'Normal equation derivation (show steps)', short: 'Derivation',
  kw: 'derive derivation normal equation gradient set to zero proof 유도',
  inputs: [XIN([[-9], [-7], [-5], [1], [5], [9]]), YIN([-6, -6, -4, -1, 1, 4]), BIAS],
  solve(v, R) {
    const X = designMatrix(v.X, v.bias, R).X, y = LA.col(v.y);
    R.formula('J(w) = (Xw − y)ᵀ(Xw − y) = wᵀXᵀXw − 2yᵀXw + yᵀy');
    R.text('∂J/∂w = 2XᵀXw − 2Xᵀy   (using d(xᵀAx)/dx = (A+Aᵀ)x and d(yᵀAx)/dx = Aᵀy)');
    R.text('Set ∂J/∂w = 0  ⇒  <b>XᵀX w = Xᵀy</b>  (normal equation)');
    R.text('If XᵀX is invertible  ⇒  <b>ŵ = (XᵀX)⁻¹Xᵀy</b>');
    R.step('XᵀX', LA.mul(LA.T(X), X)).step('Xᵀy', LA.mul(LA.T(X), y));
    const inv = LA.inv(LA.mul(LA.T(X), X));
    if (inv) R.answer('ŵ', LA.mul(inv, LA.mul(LA.T(X), y)).map(r => r[0]));
    else R.answer('ŵ', 'XᵀX singular → normal equation has infinitely many solutions');
  },
});

/* ---------------- RIDGE ---------------- */
const PD_HINT = (what = 'X') => `<span class="pdbox"><b>Primal vs Dual — 언제?</b><br>m = 샘플 수 (${what}의 행), d = 파라미터 수 (${what}의 열 — bias 1 열${what === 'P' ? '·polynomial 항' : ''} 포함)<br><b>m &gt; d → Primal</b> ŵ = (${what}ᵀ${what} + λI)⁻¹${what}ᵀy, I는 d×d<br><b>m &lt; d → Dual</b> ŵ = ${what}ᵀ(${what}${what}ᵀ + λI)⁻¹y, I는 m×m<br>m = d → 둘 다 같은 답. λ &gt; 0이면 두 form은 항상 같은 답 — 더 작은 행렬을 역행렬하는 쪽을 고르는 것 (L6 p15–16${what === 'P' ? ', p22: m, d는 X가 아니라 P의 크기' : ''})<br>λ = 0이면 m &gt; d는 primal만, m &lt; d는 dual만 가능. <b>Auto</b>로 두면 알아서 골라줘</span>`;

const RIDGE_DEF = {
  L5: { X: [[-9], [-7], [-5], [1], [5], [9]], y: [-6, -6, -4, -1, 1, 4], Xn: [[-1]] },
  T5: { X: [[1, 0, 1], [2, -1, 1], [1, 1, 5]], y: [1, 2, 3], Xn: [[-1, 2, 8], [1, 5, -1]] },
};
function ridgeTool(id, name, short, mode, desc) {
  const D = mode === 'dual' ? RIDGE_DEF.T5 : RIDGE_DEF.L5;
  tool({
    id, cat: 'ridge', name, short, desc,
    kw: 'ridge regression regularization lambda penalty shrinkage primal dual l2 릿지 정규화 ' + mode,
    inputs: [XIN(D.X), YIN(D.y),
      BIAS,
      { k: 'lam', type: 'number', label: 'λ (lambda)', def: '0.1', hint: PD_HINT('X') },
      ...(mode === 'auto' ? [{ k: 'mode', type: 'select', label: 'Form', def: 'auto', options: [['auto', 'Auto (m > d → primal, m < d → dual)'], ['primal', 'Force primal'], ['dual', 'Force dual']] }] : []),
      ...PRED(D.Xn)],
    solve(v, R) {
      if (!(v.lam >= 0)) uerr('λ must be ≥ 0');
      const md = mode === 'auto' ? v.mode : mode;
      const o = { Xraw: v.X, Y: LA.col(v.y), bias: v.bias, lambda: v.lam, mode: md, task: 'reg', Xnew: v.doPred ? v.Xnew : null };

      fitModel(o, R);
      R.note('Larger λ ⇒ more shrinkage ⇒ smaller ‖ŵ‖. (XᵀX + λI) is always invertible for λ > 0.', 'info', 'check');
      R.code(fitCode(o));
    },
  });
}

tool({
  id: 'lamcompare', cat: 'ridge', name: 'Compare several λ (shrinkage table)', short: 'Compare λ',
  kw: 'lambda compare shrinkage norm effect ridge multiple',
  inputs: [XIN([[-9], [-7], [-5], [1], [5], [9]]), YIN([-6, -6, -4, -1, 1, 4]), BIAS, { k: 'lams', type: 'list', label: 'λ values', def: '0, 0.1, 1, 10, 100' }],
  solve(v, R) {
    const X = designMatrix(v.X, v.bias, R).X, y = LA.col(v.y);
    const [m, d] = LA.shape(X);
    R.formula(m >= d ? 'ŵ(λ) = (XᵀX + λI)⁻¹Xᵀy' : 'ŵ(λ) = Xᵀ(XXᵀ + λI)⁻¹y');
    const rows = v.lams.map(l => {
      let w;
      if (m >= d) { const A = LA.add(LA.mul(LA.T(X), X), LA.scale(LA.eye(d), l)); const Ai = LA.inv(A); w = Ai ? LA.mul(Ai, LA.mul(LA.T(X), y)) : null; }
      else { const A = LA.add(LA.mul(X, LA.T(X)), LA.scale(LA.eye(m), l)); const Ai = LA.inv(A); w = Ai ? LA.mul(LA.T(X), LA.mul(Ai, y)) : null; }
      if (!w) return [l, 'singular', '', ''];

      const e = LA.sub(LA.mul(X, w), y).flat();
      return [l, '[' + wf.map(t => fmtNum(t)).join(', ') + ']', LA.norm(wf), LA.dot(e, e)];
