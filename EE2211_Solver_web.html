<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EE2211 Solver</title>
<style>
:root {
  --bg: #f6f7fb; --panel: #ffffff; --ink: #1d2230; --muted: #6b7385; --line: #e2e6ef;
  --accent: #2f5bea; --accent-ink: #ffffff; --accent-soft: #e9efff;
  --ok: #117a3e; --ok-soft: #e6f6ec; --warn: #9a6200; --warn-soft: #fff5e0; --err: #b3261e; --err-soft: #fdecea;
  --ans: #fffbe8; --ans-line: #f0cf57; --code: #0f1522; --code-ink: #dfe6f3; --hl: #ffe58a;
  --side: #ffffff; --chip: #eef1f8;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f121a; --panel: #171b26; --ink: #e5e8f0; --muted: #9aa3b5; --line: #2a3040;
    --accent: #7c9cff; --accent-ink: #0f121a; --accent-soft: #1f2940;
    --ok: #5fd08c; --ok-soft: #13291d; --warn: #f2c14e; --warn-soft: #2b2412; --err: #ff8a80; --err-soft: #331716;
    --ans: #25220f; --ans-line: #8a7424; --code: #0a0d14; --code-ink: #dfe6f3; --hl: #5c4b0e;
    --side: #131722; --chip: #222839;
  }
}
:root[data-theme="dark"] {
  --bg: #0f121a; --panel: #171b26; --ink: #e5e8f0; --muted: #9aa3b5; --line: #2a3040;
  --accent: #7c9cff; --accent-ink: #0f121a; --accent-soft: #1f2940;
  --ok: #5fd08c; --ok-soft: #13291d; --warn: #f2c14e; --warn-soft: #2b2412; --err: #ff8a80; --err-soft: #331716;
  --ans: #25220f; --ans-line: #8a7424; --code: #0a0d14; --code-ink: #dfe6f3; --hl: #5c4b0e;
  --side: #131722; --chip: #222839;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); display: flex; min-height: 100vh; }
a { color: var(--accent); text-decoration: none; }
code, .mono { font-family: var(--mono); font-size: 0.95em; }
kbd { font-family: var(--mono); background: var(--chip); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-size: 12px; }
.hidden { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: 12px; }

/* sidebar */
.side { width: 330px; flex: 0 0 330px; background: var(--side); border-right: 1px solid var(--line); height: 100vh; position: sticky; top: 0; display: flex; flex-direction: column; }
.brand { padding: 14px 16px 6px; display: flex; align-items: baseline; gap: 8px; }
.brand a { font-weight: 800; font-size: 18px; color: var(--ink); }
.brand .sub { color: var(--muted); font-size: 12px; }
.search { margin: 6px 12px; padding: 9px 11px; border: 1.5px solid var(--line); border-radius: 9px; background: var(--bg); color: var(--ink); font-size: 14px; }
.search:focus { outline: none; border-color: var(--accent); }
.treebtns { display: flex; gap: 6px; padding: 0 12px 6px; }
.tree { overflow-y: auto; padding: 4px 8px 40px; flex: 1; }
.tcat { margin: 2px 0; }
.tcat > summary { cursor: pointer; padding: 7px 8px; border-radius: 8px; font-weight: 650; display: flex; align-items: center; gap: 7px; list-style: none; user-select: none; }
.tcat > summary::-webkit-details-marker, .tsub > summary::-webkit-details-marker { display: none; }
.tcat > summary::before { content: '▸'; color: var(--muted); width: 10px; transition: transform .12s; }
.tcat[open] > summary::before { transform: rotate(90deg); }
.tcat > summary:hover { background: var(--chip); }
.ticon { width: 20px; text-align: center; }
.tcount { margin-left: auto; font-size: 11px; color: var(--muted); background: var(--chip); padding: 0 6px; border-radius: 10px; font-weight: 500; }
.tsub { margin-left: 18px; }
.tsub > summary { cursor: pointer; font-size: 12px; color: var(--muted); padding: 3px 6px; list-style: none; }
.tlink { display: block; padding: 5px 8px 5px 34px; border-radius: 7px; color: var(--ink); font-size: 13px; }
.tlink:hover { background: var(--chip); }
.tlink.active { background: var(--accent-soft); color: var(--accent); font-weight: 650; }

/* right */
.right { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.top { display: flex; align-items: center; gap: 10px; padding: 8px 18px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; }
.top .spacer { flex: 1; }
.top .set { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
.top select { background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 2px 4px; }
.homelink { font-weight: 600; }
.menu { display: none; }
.main { padding: 18px 26px 80px; max-width: 1400px; }

/* home */
.hero h1 { margin: 6px 0 4px; font-size: 26px; }
.hero p { margin: 4px 0; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; margin-top: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.card h4 { margin: 0 0 8px; font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--chip); color: var(--ink); padding: 4px 9px; border-radius: 14px; font-size: 12.5px; border: 1px solid transparent; }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip.big { display: block; margin: 5px 0; font-size: 14px; padding: 7px 12px; border-radius: 9px; }

/* tool */
.thead h2 { margin: 2px 0 4px; font-size: 21px; }
.crumb { font-size: 12px; color: var(--muted); }
.desc { margin: 4px 0 10px; color: var(--muted); max-width: 980px; }
.form { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: flex-start; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.igroup { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: flex-start; }
.igroup.wide { flex-basis: 100%; }
.inp { display: flex; flex-direction: column; gap: 4px; min-width: 160px; }
.inp-expr, .inp-textarea, .inp-exprs { min-width: min(640px, 100%); flex: 1; }
.igroup.wide .inp { width: 100%; }
.ilabel { font-size: 12px; font-weight: 650; color: var(--muted); }
.ihint { font-size: 11.5px; color: var(--muted); max-width: 520px; }
.inp input[type=text], .inp textarea, .inp select { background: var(--bg); color: var(--ink); border: 1.5px solid var(--line); border-radius: 8px; padding: 7px 9px; font-size: 14px; font-family: inherit; }
.inp textarea { font-family: var(--mono); font-size: 13px; resize: vertical; }
.inp input.mono { font-family: var(--mono); }
.inp input:focus, .inp textarea:focus, .inp select:focus { outline: none; border-color: var(--accent); }
.chk { display: flex; align-items: center; gap: 7px; font-size: 13px; cursor: pointer; padding-top: 16px; }
.chk input { width: 16px; height: 16px; }

/* matrix editor */
.mated { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
.medhead { display: flex; align-items: baseline; gap: 8px; }
.medlabel { font-weight: 700; font-size: 13px; }
.dims { font-family: var(--mono); font-size: 12px; color: var(--accent); background: var(--accent-soft); padding: 0 6px; border-radius: 6px; }
.medhint { font-size: 11px; color: var(--muted); margin-top: 2px; max-width: 360px; }
.medtools { display: flex; flex-wrap: wrap; gap: 3px; margin: 6px 0; }
button.mini { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 2px 7px; font-size: 12px; cursor: pointer; font-family: inherit; }
button.mini:hover { border-color: var(--accent); color: var(--accent); }
button.mini.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.gridwrap { overflow-x: auto; max-width: 100%; }
.gridwrap.brk .grid { border-left: 2px solid var(--ink); border-right: 2px solid var(--ink); border-radius: 4px; }
.grid { border-collapse: separate; border-spacing: 3px; }
.grid td { padding: 0; }
.grid .rix { font-size: 10px; color: var(--muted); padding-right: 2px; text-align: right; }
.grid .clab { font-size: 11px; color: var(--muted); text-align: center; font-family: var(--mono); }
input.cell { width: 64px; padding: 5px 5px; text-align: center; font-family: var(--mono); font-size: 13px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); color: var(--ink); }
input.cell:focus { outline: 2px solid var(--accent); border-color: transparent; }
.mated.vec input.cell { width: 72px; }
.pastebox { margin: 4px 0 6px; display: flex; flex-direction: column; gap: 4px; }
.pastebox textarea { width: 260px; font-family: var(--mono); font-size: 12px; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 5px; }

.actions { display: flex; align-items: center; gap: 10px; margin: 12px 0; }
button.solve { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 10px 26px; font-size: 15px; font-weight: 700; cursor: pointer; }
button.solve:hover { filter: brightness(1.08); }

/* report */
.report { display: flex; flex-direction: column; gap: 10px; }
.rsec { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; overflow-x: auto; }
.rsec h3 { margin: 0 0 6px; font-size: 12px; letter-spacing: .04em; color: var(--muted); }
.sec-answer { border: 2px solid var(--ans-line); background: var(--ans); }
.sec-answer h3 { color: var(--warn); }
.sec-detect { border-left: 4px solid var(--accent); }
.detect { font-size: 14px; }
.rrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 4px 0; border-bottom: 1px dashed var(--line); }
.rrow:last-child { border-bottom: 0; }
.rlabel { font-weight: 600; white-space: nowrap; }
.rnote { color: var(--muted); font-size: 13px; }
.formula { font-family: var(--mono); font-size: 15px; font-weight: 600; padding: 3px 0; display: flex; flex-direction: column; gap: 2px; }
.fnote { font-family: var(--sans); font-size: 12.5px; font-weight: 400; color: var(--muted); }
.find { font-size: 14px; }
.txt { padding: 3px 0; }
.ans { position: relative; padding: 6px 70px 8px 0; border-bottom: 1px solid var(--ans-line); }
.ans:last-child { border-bottom: 0; }
.anslabel { font-weight: 700; font-size: 13px; color: var(--muted); }
.ansval { font-size: 18px; font-weight: 700; margin-top: 2px; }
.ansval .num { font-family: var(--mono); font-size: 20px; }
.anssub { font-size: 13px; color: var(--muted); margin-top: 2px; }
.ans > .copyb { position: absolute; right: 0; top: 6px; }
.note { padding: 7px 10px; border-radius: 8px; margin: 4px 0; font-size: 13px; }
.note.info { background: var(--accent-soft); }
.note.warn { background: var(--warn-soft); color: var(--warn); }
.note.err { background: var(--err-soft); color: var(--err); }
.note.ok { background: var(--ok-soft); color: var(--ok); }
.note.big { font-size: 15px; padding: 12px 14px; }
b.yes { color: var(--ok); }
b.no { color: var(--err); }

.matwrap { display: inline-flex; align-items: center; gap: 4px; vertical-align: middle; position: relative; }
.mat { display: inline-block; border-left: 2px solid var(--ink); border-right: 2px solid var(--ink); border-radius: 5px; padding: 1px 3px; }
.mtab { border-collapse: collapse; font-family: var(--mono); font-size: 13.5px; }
.mtab td { padding: 1px 8px; text-align: right; white-space: nowrap; }
.mtab td.hl { background: var(--hl); border-radius: 3px; }
.mtab tr.clabs td { font-size: 11px; color: var(--muted); text-align: center; font-family: var(--sans); }
.rlabs { border-collapse: collapse; font-size: 11.5px; color: var(--muted); margin-right: 2px; }
.rlabs td { padding: 1px 4px; text-align: right; white-space: nowrap; font-family: var(--mono); }
.mdims { font-size: 10.5px; color: var(--muted); font-family: var(--mono); align-self: flex-end; }
.copyb { border: 1px solid var(--line); background: var(--panel); color: var(--muted); border-radius: 5px; font-size: 11px; cursor: pointer; padding: 1px 5px; opacity: 0; transition: opacity .15s; }
.matwrap:hover .copyb, .copyb.vis { opacity: 1; }
.copyb:hover { color: var(--accent); border-color: var(--accent); }
.ansval .matwrap .mtab { font-size: 15px; }
code.expr { background: var(--chip); padding: 1px 6px; border-radius: 5px; font-size: 14px; }

.tscroll { overflow-x: auto; }
.rtable { border-collapse: collapse; font-size: 13px; margin: 4px 0; }
.rtable th { text-align: left; font-size: 12px; color: var(--muted); padding: 4px 10px; border-bottom: 1.5px solid var(--line); white-space: nowrap; }
.rtable td { padding: 4px 10px; border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 13px; vertical-align: middle; }
.rtable td .mtab { font-size: 12px; }

.codebox { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; }
.codebox summary { cursor: pointer; font-weight: 650; display: flex; align-items: center; gap: 10px; }
pre.code { background: var(--code); color: var(--code-ink); padding: 12px 14px; border-radius: 9px; overflow-x: auto; font-family: var(--mono); font-size: 12.5px; line-height: 1.5; margin: 8px 0 4px; white-space: pre; }
pre.code.big { font-size: 13px; font-weight: 400; }
.sec-answer pre.code { font-weight: 400; }

@media (max-width: 900px) {
  .side { position: fixed; left: -340px; z-index: 20; transition: left .2s; box-shadow: 0 0 30px rgba(0,0,0,.2); }
  body.sideopen .side { left: 0; }
  .menu { display: inline-block; }
  .main { padding: 14px 16px 80px; }
}
@media print { .side, .top, .actions, .medtools { display: none !important; } }

details.example { margin-top: 10px; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; padding: 8px 12px; color: var(--ink); line-height: 1.7; }
details.example summary { cursor: pointer; font-weight: 700; color: var(--accent); }

details.guide { margin: 10px 0 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; max-width: 1100px; }
details.guide summary { cursor: pointer; font-weight: 700; color: var(--warn); }
.gtab { border-collapse: collapse; margin-top: 6px; width: 100%; font-size: 13px; }
.gtab td { padding: 5px 6px; border-top: 1px dashed var(--line); vertical-align: top; }
.gtab tr:first-child td { border-top: 0; }
.gtab td.gq { width: 48%; color: var(--ink); }
.gtab td.garrow { width: 20px; color: var(--muted); text-align: center; }
.gtab td.ga { color: var(--ink); }
.gtab code { background: var(--chip); padding: 0 4px; border-radius: 4px; }

input.cell.lock { background: var(--chip); color: var(--muted); border-style: dashed; cursor: not-allowed; font-weight: 700; }
.clab.lockl { color: var(--warn); font-weight: 700; white-space: nowrap; }
.biasnote { font-size: 11px; color: var(--warn); margin-left: 4px; }

.formed { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px; max-width: 100%; }
.frows { display: flex; flex-direction: column; gap: 4px; overflow-x: auto; padding-bottom: 2px; }
.frow { display: flex; align-items: center; gap: 4px; flex-wrap: nowrap; white-space: nowrap; }
.frow .fix { font-size: 10px; color: var(--muted); width: 16px; text-align: right; }
.ft { font-family: var(--mono); font-size: 14px; color: var(--muted); }
.ft.fv { color: var(--ink); font-weight: 600; }
.ft.farrow { color: var(--warn); font-weight: 700; padding: 0 4px; }
input.cell.fcell { width: 60px; }
input.cell.fcell.wide { width: 86px; }
.fbias { font-family: var(--mono); font-weight: 700; background: var(--chip); color: var(--muted); border: 1px dashed var(--line); border-radius: 5px; padding: 3px 8px; cursor: not-allowed; }

.pdbox { display: block; margin-top: 4px; padding: 7px 10px; background: var(--warn-soft); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; font-size: 12.5px; line-height: 1.55; max-width: 560px; }
.pdbox b { color: var(--warn); }

/* quick links + calculator tape */
.top .quick { white-space: nowrap; font-size: 13px; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); font-weight: 600; }
.tapebox { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); }
.tape { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 8px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tape:last-child { border-bottom: 0; }
.tape.bad { background: var(--err-soft); }
.tin { display: flex; align-items: center; gap: 10px; min-width: 0; }
.tin code { font-size: 14px; word-break: break-all; }
.tno { font-size: 11px; color: var(--muted); min-width: 16px; }
.tout { display: flex; align-items: baseline; gap: 10px; margin-left: auto; flex-wrap: wrap; justify-content: flex-end; }
.tout.err { color: var(--err); font-size: 13px; }
.tname { color: var(--muted); font-family: var(--mono); }
.bdec { font-family: var(--mono); font-size: 18px; font-weight: 700; }
.bex { font-family: var(--mono); font-size: 15px; color: var(--accent); font-weight: 600; }
.tout .copyb { position: static; }
.rtable.aug td, .rtable.aug th { text-align: right; }
.rtable.aug .augbar { border-left: 2px solid var(--muted); }

/* slide finder */
.sec-raw { background: transparent; border: 0; padding: 0; box-shadow: none; }
.slnote { margin: 4px 0 10px; color: var(--muted); }
.slgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.slcard { display: flex; flex-direction: column; gap: 4px; text-align: left; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 8px; cursor: pointer; font: inherit; }
.slcard:hover { border-color: var(--accent); box-shadow: 0 2px 10px rgba(0,0,0,.08); }
.slcard img { width: 100%; aspect-ratio: 4 / 3; object-fit: contain; background: #fff; border-radius: 6px; border: 1px solid var(--line); }
.slmeta { font-size: 12px; color: var(--accent); }
.sltitle { font-weight: 700; font-size: 14px; }
.slsnip { font-size: 12px; color: var(--muted); line-height: 1.4; }
.slsnip mark, .rawbox mark { background: var(--hl); color: inherit; border-radius: 2px; }
.sltoc { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; margin-bottom: 8px; }
.sltoc summary { cursor: pointer; font-weight: 650; }
.sltoc ul { margin: 6px 0 0; padding-left: 18px; columns: 2 320px; }
.sltoc li { margin: 2px 0; break-inside: avoid; }

/* "question wording → value" table: large, plain */
.terms { border: 2px solid var(--accent); border-radius: 12px; background: var(--panel); margin: 12px 0; overflow: hidden; }
.termshead { font-size: 16px; font-weight: 800; padding: 10px 14px; background: var(--accent-soft); color: var(--accent); }
.term { display: grid; grid-template-columns: minmax(0, 1fr) minmax(160px, auto); gap: 18px; align-items: center; padding: 12px 14px; border-top: 1px solid var(--line); }
.term.star { background: var(--ans); }
.tqw { font-size: 17px; font-weight: 750; line-height: 1.35; }
.tko { font-size: 15px; margin-top: 3px; line-height: 1.4; }
.tf { font-family: var(--mono); font-size: 14px; color: var(--muted); margin-top: 3px; }
.tv { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; justify-content: flex-end; text-align: right; }
.tvn { font-family: var(--mono); font-size: 24px; font-weight: 800; }
.tvf { font-family: var(--mono); font-size: 16px; color: var(--accent); font-weight: 700; }
.tv .copyb { position: static; }
@media (max-width: 760px) { .term { grid-template-columns: 1fr; } .tv { justify-content: flex-start; text-align: left; } }

/* glossary */
.gloss { display: flex; flex-direction: column; gap: 10px; }
.gitem { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.gw { font-size: 17px; font-weight: 750; line-height: 1.35; }
.gko { font-size: 15px; margin-top: 4px; }
.gf { font-family: var(--mono); font-size: 14px; color: var(--muted); margin-top: 4px; }
.gl { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.gl .chip { font-size: 13px; }
.gl .slidechip { background: var(--accent-soft); }
.gitem mark { background: var(--hl); color: inherit; border-radius: 2px; }

/* merged pages: one block per absorbed solver */
.sec-parts { background: transparent; border: 0; padding: 0; overflow: visible; }
.part { margin-top: 22px; border-top: 3px solid var(--accent); padding-top: 6px; }
.parth { font-size: 20px; margin: 6px 0 10px; color: var(--accent); }
.part .report { display: flex; flex-direction: column; gap: 10px; }
.partlist { background: var(--accent-soft); border-radius: 10px; padding: 10px 14px; font-size: 14px; line-height: 1.6; }

</style>
</head>
<body>
<noscript>This solver needs JavaScript.</noscript>
<script>
/* ==== core.js ==== */
'use strict';
/* =====================================================================
   core.js — number formatting + linear algebra (no dependencies)
   ===================================================================== */

class UserError extends Error {}
function uerr(msg) { throw new UserError(msg); }

/* ---------- number formatting ---------- */
const Fmt = { dec: 6, frac: false }; // never below 5 decimal places

function fracOf(x, maxDen = 1000) {
  if (!isFinite(x)) return null;
  const sign = x < 0 ? -1 : 1;
  const ax = Math.abs(x);
  if (Math.abs(ax - Math.round(ax)) < 1e-10) return [sign * Math.round(ax), 1];
  let h0 = 0, h1 = 1, k0 = 1, k1 = 0, b = ax;
  for (let i = 0; i < 40; i++) {
    const a = Math.floor(b);
    const h2 = a * h1 + h0, k2 = a * k1 + k0;
    if (k2 > maxDen) break;
    h0 = h1; h1 = h2; k0 = k1; k1 = k2;
    if (Math.abs(ax - h1 / k1) < 1e-9 * Math.max(1, ax)) return [sign * h1, k1];
    const r = b - a;
    if (r < 1e-15) break;
    b = 1 / r;
  }
  return null;
}

function fmtNum(x, o = {}) {
  if (typeof x !== 'number') return String(x);
  if (Number.isNaN(x)) return 'NaN';
  if (x === Infinity) return '∞';
  if (x === -Infinity) return '−∞';
  const d = o.dec ?? Fmt.dec;
  if (Math.abs(x) < 1e-12) x = 0;
  if (Fmt.frac && !o.noFrac) {
    const f = fracOf(x, 1000);
    if (f) return f[1] === 1 ? String(f[0]) : `${f[0]}/${f[1]}`;
  }
  if (x !== 0 && Math.abs(x) < Math.pow(10, -d) * 0.5) {
    return x.toExponential(Math.max(5, d - 1)).replace(/\.?0+e/, 'e');
  }
  if (Math.abs(x) >= 1e12) return x.toExponential(d);
  let s = x.toFixed(d);
  if (s.includes('.')) s = s.replace(/0+$/, '').replace(/\.$/, '');
  if (s === '-0') s = '0';
  return s;
}

/* decimal plus fraction hint, e.g. "0.6667 (= 2/3)" */
function fmtExact(x) {
  const s = fmtNum(x);
  if (typeof x !== 'number' || Fmt.frac) return s;
  const f = fracOf(x, 1000);
  if (f && f[1] !== 1 && f[1] <= 1000) return `${s}  (= ${f[0]}/${f[1]})`;
  return s;
}

/* ---------- linear algebra ---------- */
const LA = {
  shape: A => [A.length, A.length ? A[0].length : 0],
  dims: A => `${A.length} × ${A.length ? A[0].length : 0}`,
  zeros: (m, n) => Array.from({ length: m }, () => Array(n).fill(0)),
  ones: (m, n) => Array.from({ length: m }, () => Array(n).fill(1)),
  eye: n => Array.from({ length: n }, (_, i) => Array.from({ length: n }, (_, j) => (i === j ? 1 : 0))),
  clone: A => A.map(r => r.slice()),
  T: A => (A.length ? A[0].map((_, j) => A.map(r => r[j])) : []),
  col: v => v.map(x => [x]),
  flat: A => A.map(r => r[0]),
  isVec: A => A[0].length === 1,

  add(A, B, na = 'A', nb = 'B') {
    if (A.length !== B.length || A[0].length !== B[0].length)
      uerr(`${na} + ${nb} cannot be computed: ${na} is ${LA.dims(A)} but ${nb} is ${LA.dims(B)} (they must have the same size).`);
    return A.map((r, i) => r.map((x, j) => x + B[i][j]));
  },
  sub(A, B, na = 'A', nb = 'B') {
    if (A.length !== B.length || A[0].length !== B[0].length)
      uerr(`${na} − ${nb} cannot be computed: ${na} is ${LA.dims(A)} but ${nb} is ${LA.dims(B)} (they must have the same size).`);
    return A.map((r, i) => r.map((x, j) => x - B[i][j]));
  },
  scale: (A, k) => A.map(r => r.map(x => x * k)),
  mul(A, B, na = 'A', nb = 'B') {
    const [m, n] = LA.shape(A), [p, q] = LA.shape(B);
    if (n !== p)
      uerr(`${na}${nb} cannot be computed because ${na} has ${n} column${n === 1 ? '' : 's'} (${na} is ${m} × ${n}) but ${nb} has ${p} row${p === 1 ? '' : 's'} (${nb} is ${p} × ${q}). Inner dimensions must match.`);
    const C = LA.zeros(m, q);
    for (let i = 0; i < m; i++)
      for (let k = 0; k < n; k++) {
        const a = A[i][k];
        if (a === 0) continue;
        for (let j = 0; j < q; j++) C[i][j] += a * B[k][j];
      }
    return C;
  },
  hstack: (A, B) => A.map((r, i) => r.concat(B[i])),
  vstack: (A, B) => A.concat(B),
  maxAbs: A => A.reduce((mx, r) => r.reduce((m2, x) => Math.max(m2, Math.abs(x)), mx), 0),
  trace: A => A.reduce((s, r, i) => s + r[i], 0),
  dot: (a, b) => a.reduce((s, x, i) => s + x * b[i], 0),
  norm: a => Math.sqrt(a.reduce((s, x) => s + x * x, 0)),
  fro: A => Math.sqrt(A.reduce((s, r) => s + r.reduce((t, x) => t + x * x, 0), 0)),
  clean(A, tol = 1e-11) {
    const s = Math.max(1, LA.maxAbs(A));
    return A.map(r => r.map(x => (Math.abs(x) < tol * s ? 0 : x)));
  },
  isIdentity(A, tol = 1e-8) {
    if (A.length !== A[0].length) return false;
    return A.every((r, i) => r.every((x, j) => Math.abs(x - (i === j ? 1 : 0)) < tol));
  },
  approxEq(A, B, tol = 1e-8) {
    if (A.length !== B.length || A[0].length !== B[0].length) return false;
    const s = Math.max(1, LA.maxAbs(B));
    return A.every((r, i) => r.every((x, j) => Math.abs(x - B[i][j]) < tol * s));
  },

  /* One-sided Jacobi SVD. Returns {U (m×k), S (k), V (n×k)} with A = U diag(S) Vᵀ */
  svd(A0) {
    let A = LA.clone(A0);
    let [m, n] = LA.shape(A);
    let trans = false;
    if (m < n) { A = LA.T(A); [m, n] = [n, m]; trans = true; }
    const U = A, V = LA.eye(n);
    for (let sweep = 0; sweep < 80; sweep++) {
      let rotated = false;
      for (let p = 0; p < n - 1; p++)
        for (let q = p + 1; q < n; q++) {
          let alpha = 0, beta = 0, gamma = 0;
          for (let i = 0; i < m; i++) {
            alpha += U[i][p] * U[i][p];
            beta += U[i][q] * U[i][q];
            gamma += U[i][p] * U[i][q];
          }
          if (gamma === 0 || Math.abs(gamma) <= 1e-15 * Math.sqrt(alpha * beta)) continue;
          rotated = true;
          const zeta = (beta - alpha) / (2 * gamma);
          const t = (zeta >= 0 ? 1 : -1) / (Math.abs(zeta) + Math.sqrt(1 + zeta * zeta));
          const c = 1 / Math.sqrt(1 + t * t), s = c * t;
          for (let i = 0; i < m; i++) {
            const up = U[i][p], uq = U[i][q];
            U[i][p] = c * up - s * uq;
            U[i][q] = s * up + c * uq;
          }
          for (let i = 0; i < n; i++) {
            const vp = V[i][p], vq = V[i][q];
            V[i][p] = c * vp - s * vq;
            V[i][q] = s * vp + c * vq;
          }
        }
      if (!rotated) break;
    }
    const S = [];
    for (let j = 0; j < n; j++) {
      let s = 0;
      for (let i = 0; i < m; i++) s += U[i][j] * U[i][j];
      s = Math.sqrt(s);
      S.push(s);
      if (s > 0) for (let i = 0; i < m; i++) U[i][j] /= s;
    }
    // sort descending
    const idx = S.map((_, i) => i).sort((a, b) => S[b] - S[a]);
    const Ss = idx.map(i => S[i]);
    const Us = U.map(r => idx.map(i => r[i]));
    const Vs = V.map(r => idx.map(i => r[i]));
    return trans ? { U: Vs, S: Ss, V: Us } : { U: Us, S: Ss, V: Vs };
  },
  svTol(A, S) {
    const [m, n] = LA.shape(A);
    return Math.max(m, n) * (S[0] || 0) * 1e-14;
  },
  rank(A) {
    if (!A.length || !A[0].length) return 0;
    if (LA.maxAbs(A) === 0) return 0;
    const { S } = LA.svd(A);
    const tol = LA.svTol(A, S);
    return S.filter(s => s > tol).length;
  },
  pinv(A) {
    const { U, S, V } = LA.svd(A);
    const tol = LA.svTol(A, S);
    const [m, n] = LA.shape(A);
    const P = LA.zeros(n, m);
    for (let k = 0; k < S.length; k++) {
      if (S[k] <= tol) continue;
      const inv = 1 / S[k];
      for (let i = 0; i < n; i++)
        for (let j = 0; j < m; j++) P[i][j] += V[i][k] * inv * U[j][k];
    }
    return P;
  },

  /* determinant by LU with partial pivoting */
  det(A) {
    const n = A.length;
    if (n !== A[0].length) return null;
    if (n === 1) return A[0][0];
    if (n === 2) return A[0][0] * A[1][1] - A[0][1] * A[1][0];
    if (LA.rank(A) < n) return 0;
    const M = LA.clone(A);
    let d = 1;
    for (let k = 0; k < n; k++) {
      let p = k;
      for (let i = k + 1; i < n; i++) if (Math.abs(M[i][k]) > Math.abs(M[p][k])) p = i;
      if (M[p][k] === 0) return 0;
      if (p !== k) { [M[p], M[k]] = [M[k], M[p]]; d = -d; }
      d *= M[k][k];
      for (let i = k + 1; i < n; i++) {
        const f = M[i][k] / M[k][k];
        for (let j = k; j < n; j++) M[i][j] -= f * M[k][j];
      }
    }
    return d;
  },
  isInvertible(A) {
    return A.length === A[0].length && LA.rank(A) === A.length;
  },
  /* Gauss-Jordan inverse; null if not square or singular */
  inv(A) {
    const n = A.length;
    if (!n || n !== A[0].length) return null;
    if (LA.rank(A) < n) return null;
    const M = A.map((r, i) => r.concat(LA.eye(n)[i]));
    for (let k = 0; k < n; k++) {
      let p = k;
      for (let i = k + 1; i < n; i++) if (Math.abs(M[i][k]) > Math.abs(M[p][k])) p = i;
      if (M[p][k] === 0) return null;
      [M[p], M[k]] = [M[k], M[p]];
      const piv = M[k][k];
      for (let j = 0; j < 2 * n; j++) M[k][j] /= piv;
      for (let i = 0; i < n; i++) {
        if (i === k) continue;
        const f = M[i][k];
        if (f === 0) continue;
        for (let j = 0; j < 2 * n; j++) M[i][j] -= f * M[k][j];
      }
    }
    return M.map(r => r.slice(n));
  },

  /* row reduction with human-readable steps (for display) */
  rrefSteps(A0, { full = false } = {}) {
    const A = LA.clone(A0);
    const [m, n] = LA.shape(A);
    const tol = 1e-10 * Math.max(1, LA.maxAbs(A));
    const steps = [];
    const pivots = [];
    let r = 0;
    for (let c = 0; c < n && r < m; c++) {
      let p = -1;
      for (let i = r; i < m; i++) if (Math.abs(A[i][c]) > tol && (p < 0 || Math.abs(A[i][c]) > Math.abs(A[p][c]))) p = i;
      // prefer a row with a "nice" pivot (keeps textbook look): take first nonzero if it is ±1
      for (let i = r; i < m; i++) if (Math.abs(Math.abs(A[i][c]) - 1) < 1e-12) { p = i; break; }
      if (p < 0) continue;
      if (p !== r) {
        [A[p], A[r]] = [A[r], A[p]];
        steps.push({ op: `R${r + 1} ↔ R${p + 1}`, M: LA.clone(A) });
      }
      if (full && Math.abs(A[r][c] - 1) > 1e-12) {
        const pv = A[r][c];
        for (let j = 0; j < n; j++) A[r][j] /= pv;
        steps.push({ op: `R${r + 1} ← R${r + 1} / ${fmtNum(pv)}`, M: LA.clone(A) });
      }
      for (let i = full ? 0 : r + 1; i < m; i++) {
        if (i === r) continue;
        const f = A[i][c] / A[r][c];
        if (Math.abs(f) < 1e-14) continue;
        for (let j = 0; j < n; j++) {
          A[i][j] -= f * A[r][j];
          if (Math.abs(A[i][j]) < tol) A[i][j] = 0;
        }
        const fs = fmtNum(Math.abs(f));
        steps.push({ op: `R${i + 1} ← R${i + 1} ${f > 0 ? '−' : '+'} ${fs === '1' ? '' : fs}R${r + 1}`, M: LA.clone(A) });
      }
      pivots.push([r, c]);
      r++;
    }
    return { R: LA.clean(A), steps, pivots, rank: pivots.length };
  },

  minorMat(A, i, j) {
    return A.filter((_, r) => r !== i).map(row => row.filter((_, c) => c !== j));
  },
  minor(A, i, j) { return LA.det(LA.minorMat(A, i, j)); },
  minors(A) { return A.map((r, i) => r.map((_, j) => (A.length === 1 ? 1 : LA.minor(A, i, j)))); },
  cofactors(A) { return LA.minors(A).map((r, i) => r.map((x, j) => ((i + j) % 2 ? -x : x) + 0)); },
  adj(A) { return LA.T(LA.cofactors(A)); },

  /* symmetric eigen-decomposition (cyclic Jacobi) */
  eigSym(A0) {
    const n = A0.length;
    const A = LA.clone(A0), V = LA.eye(n);
    for (let sweep = 0; sweep < 100; sweep++) {
      let off = 0;
      for (let p = 0; p < n; p++) for (let q = p + 1; q < n; q++) off += A[p][q] * A[p][q];
      if (off < 1e-22) break;
      for (let p = 0; p < n - 1; p++)
        for (let q = p + 1; q < n; q++) {
          if (Math.abs(A[p][q]) < 1e-300) continue;
          const theta = (A[q][q] - A[p][p]) / (2 * A[p][q]);
          const t = (theta >= 0 ? 1 : -1) / (Math.abs(theta) + Math.sqrt(theta * theta + 1));
          const c = 1 / Math.sqrt(t * t + 1), s = t * c;
          for (let k = 0; k < n; k++) {
            const akp = A[k][p], akq = A[k][q];
            A[k][p] = c * akp - s * akq;
            A[k][q] = s * akp + c * akq;
          }
          for (let k = 0; k < n; k++) {
            const apk = A[p][k], aqk = A[q][k];
            A[p][k] = c * apk - s * aqk;
            A[q][k] = s * apk + c * aqk;
          }
          for (let k = 0; k < n; k++) {
            const vkp = V[k][p], vkq = V[k][q];
            V[k][p] = c * vkp - s * vkq;
            V[k][q] = s * vkp + c * vkq;
          }
        }
    }
    return { values: A.map((r, i) => r[i]), vectors: V };
  },
  matPow(A, k) {
    let R = LA.eye(A.length), B = A;
    while (k > 0) { if (k & 1) R = LA.mul(R, B); B = LA.mul(B, B); k >>= 1; }
    return R;
  },
};

/* numbers helpers */
const NUM = {
  sum: a => a.reduce((s, x) => s + x, 0),
  mean: a => NUM.sum(a) / a.length,
  sorted: a => a.slice().sort((x, y) => x - y),
  median(a) {
    const s = NUM.sorted(a), n = s.length;
    return n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2;
  },
  comb(n, k) {
    if (k < 0 || k > n) return 0;
    k = Math.min(k, n - k);
    let r = 1;
    for (let i = 1; i <= k; i++) r = (r * (n - k + i)) / i;
    return Math.round(r);
  },
  gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; },
  erf(x) {
    // high accuracy erf (series / continued fraction)
    const ax = Math.abs(x);
    if (ax < 3) {
      let sum = x, term = x, x2 = x * x;
      for (let n = 1; n < 200; n++) {
        term *= -x2 / n;
        const add = term / (2 * n + 1);
        sum += add;
        if (Math.abs(add) < 1e-17 * Math.abs(sum)) break;
      }
      return (2 / Math.sqrt(Math.PI)) * sum;
    }
    // erfc continued fraction (Lentz)
    const z = ax;
    let f = z, C = z, D = 0;
    for (let n = 1; n < 300; n++) {
      const an = n / 2;
      D = z + an * D; D = D === 0 ? 1e-300 : 1 / D;
      C = z + an / C; if (C === 0) C = 1e-300;
      const delta = C * D;
      f *= delta;
      if (Math.abs(delta - 1) < 1e-16) break;
    }
    const erfc = Math.exp(-z * z) / Math.sqrt(Math.PI) / f;
    return x > 0 ? 1 - erfc : erfc - 1;
  },
  normCdf: (x, mu = 0, s = 1) => 0.5 * (1 + NUM.erf((x - mu) / (s * Math.SQRT2))),
  normPdf: (x, mu = 0, s = 1) => Math.exp(-0.5 * ((x - mu) / s) ** 2) / (s * Math.sqrt(2 * Math.PI)),
  normInv(p, mu = 0, s = 1) {
    let lo = -40, hi = 40;
    for (let i = 0; i < 200; i++) { const mid = (lo + hi) / 2; if (NUM.normCdf(mid) < p) lo = mid; else hi = mid; }
    return mu + s * (lo + hi) / 2;
  },
};

if (false) module.exports = { UserError, uerr, Fmt, fracOf, fmtNum, fmtExact, LA, NUM };

/* ==== expr.js ==== */
'use strict';
/* =====================================================================
   expr.js — expression parser, evaluator, symbolic differentiation,
   simplification and polynomial canonical form.
   ===================================================================== */

const EX = (() => {
  const FUNCS = {
    sin: Math.sin, cos: Math.cos, tan: Math.tan, asin: Math.asin, acos: Math.acos, atan: Math.atan,
    sinh: Math.sinh, cosh: Math.cosh, tanh: Math.tanh, exp: Math.exp, ln: Math.log, log: Math.log,
    log10: Math.log10, log2: Math.log2, sqrt: Math.sqrt, abs: Math.abs, sign: Math.sign,
    floor: Math.floor, ceil: Math.ceil, round: Math.round,
    sigmoid: x => 1 / (1 + Math.exp(-x)), relu: x => Math.max(0, x),
    min: Math.min, max: Math.max,
    fact: n => { if (!Number.isInteger(n) || n < 0) return NaN; let r = 1; for (let i = 2; i <= n; i++) r *= i; return r; },
    nCr: (n, k) => { if (!Number.isInteger(n) || !Number.isInteger(k) || k < 0 || k > n) return 0; k = Math.min(k, n - k); let r = 1; for (let i = 1; i <= k; i++) r = (r * (n - k + i)) / i; return Math.round(r); },
    nPr: (n, k) => { if (!Number.isInteger(n) || !Number.isInteger(k) || k < 0 || k > n) return 0; let r = 1; for (let i = 0; i < k; i++) r *= n - i; return r; },
  };
  const CONSTS = { pi: Math.PI, e: Math.E, π: Math.PI };

  function normalize(s) {
    return String(s)
      .replace(/\*\*/g, '^').replace(/[−–]/g, '-').replace(/[·×]/g, '*').replace(/÷/g, '/')
      .replace(/²/g, '^2').replace(/³/g, '^3').replace(/≤/g, '<=').replace(/≥/g, '>=').replace(/≠/g, '!=')
      .replace(/\band\b/g, '&&').replace(/\bor\b/g, '||').replace(/\bnot\b/g, '!');
  }

  function tokenize(src) {
    const s = normalize(src);
    const toks = [];
    let i = 0;
    while (i < s.length) {
      const c = s[i];
      if (/\s/.test(c)) { i++; continue; }
      if (/[0-9.]/.test(c)) {
        const m = s.slice(i).match(/^(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?/);
        if (!m) throw new UserError(`Bad number near "${s.slice(i, i + 8)}"`);
        toks.push({ t: 'num', v: parseFloat(m[0]) });
        i += m[0].length;
        continue;
      }
      if (/[A-Za-z_Ͱ-Ͽ]/.test(c)) {
        const m = s.slice(i).match(/^[A-Za-z_Ͱ-Ͽ][A-Za-z0-9_Ͱ-Ͽ]*/);
        toks.push({ t: 'id', v: m[0] });
        i += m[0].length;
        continue;
      }
      const two = s.slice(i, i + 2);
      if (['<=', '>=', '==', '!=', '&&', '||'].includes(two)) { toks.push({ t: 'op', v: two }); i += 2; continue; }
      if ('+-*/^(),<>!%='.includes(c)) {
        toks.push({ t: 'op', v: c === '=' ? '==' : c });
        i++;
        continue;
      }
      throw new UserError(`Unexpected character "${c}" in expression`);
    }
    return toks;
  }

  /* ---- AST constructors ---- */
  const N = v => ({ t: 'num', v });
  const V = n => ({ t: 'var', n });
  const B = (op, a, b) => ({ t: 'bin', op, a, b });
  const NEG = a => ({ t: 'neg', a });
  const CALL = (f, args) => ({ t: 'call', f, args });

  function parse(src) {
    if (src == null || String(src).trim() === '') throw new UserError('Empty expression');
    const toks = tokenize(src);
    let p = 0;
    const peek = () => toks[p];
    const isOp = v => toks[p] && toks[p].t === 'op' && toks[p].v === v;
    const eat = v => {
      if (!isOp(v)) throw new UserError(`Expected "${v}" in expression`);
      p++;
    };

    function orE() { let a = andE(); while (isOp('||')) { p++; a = { t: 'logic', op: '||', a, b: andE() }; } return a; }
    function andE() { let a = notE(); while (isOp('&&')) { p++; a = { t: 'logic', op: '&&', a, b: notE() }; } return a; }
    function notE() { if (isOp('!')) { p++; return { t: 'not', a: notE() }; } return cmpE(); }
    function cmpE() {
      let a = addE();

    if (e.key === 'Enter' && !(e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      if (i + 1 >= m) { this.addRow(); focus(i + 1, j); } else focus(i + 1, j);
    } else if (e.key === 'ArrowDown') { e.preventDefault(); focus(Math.min(m - 1, i + 1), j); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); focus(Math.max(0, i - 1), j); }
    else if (e.key === 'ArrowRight' && e.target.selectionStart === e.target.value.length) { if (j + 1 < n) { e.preventDefault(); focus(i, j + 1); } }
    else if (e.key === 'ArrowLeft' && e.target.selectionStart === 0) { if (j > 0) { e.preventDefault(); focus(i, j - 1); } }
  }
  value() {
    this.sync();
    const name = (this.spec.sym || this.spec.k);
    const M = this.raw.map((r, i) => r.map((c, j) => {
      try { return parseCell(c, this.spec.allowNA); } catch (err) {
        throw new UserError(`${name}: cell (row ${i + 1}, col ${j + 1}) = "${c}" is not a number`);
      }
    }));
    return this.isVec ? M.map(r => r[0]) : M;
  }
}

/* ---------- report builder ---------- */
const SECTIONS = [
  ['raw', ''],
  ['detect', 'Detected task'],
  ['given', '1. WHAT IS GIVEN?'],
  ['find', '2. WHAT ARE WE FINDING?'],
  ['formula', '3. WHICH FORMULA APPLIES?'],
  ['work', '4. SUBSTITUTE THE VALUES / STEPS'],
  ['answer', '5. FINAL ANSWER'],
  ['check', '6. CHECK / VERIFICATION'],
  ['parts', ''],
];
function isMat(v) { return Array.isArray(v) && v.length && Array.isArray(v[0]); }
function pyNum(x) {
  if (Number.isNaN(x)) return 'np.nan';
  if (Number.isInteger(x)) return String(x);
  return String(+x.toPrecision(10));
}
function pyArr(v) {
  if (isMat(v)) return `np.array([${v.map(r => '[' + r.map(pyNum).join(', ') + ']').join(', ')}])`;
  if (Array.isArray(v)) return `np.array([${v.map(pyNum).join(', ')}])`;
  return pyNum(v);
}
function matText(v) {
  if (isMat(v)) return '[' + v.map(r => '[' + r.map(x => fmtNum(x)).join(', ') + ']').join(',\n ') + ']';
  if (Array.isArray(v)) return '[' + v.map(x => fmtNum(x)).join(', ') + ']ᵀ';
  if (typeof v === 'number') return fmtNum(v);
  return String(v);
}
function copyText(t, btn) {
  const done = () => { if (btn) { const o = btn.textContent; btn.textContent = '✓'; setTimeout(() => (btn.textContent = o), 900); } };
  try { navigator.clipboard.writeText(t).then(done, () => fallback()); } catch (e) { fallback(); }
  function fallback() { const ta = h('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) { /* */ } ta.remove(); done(); }
}

function renderVal(v, o = {}) {
  if (v == null) return h('span', null, '—');
  if (v instanceof Node) return v;
  if (typeof v === 'object' && v.html != null) return h('span', { html: v.html });
  if (typeof v === 'object' && v.expr) return h('code', { class: 'expr' }, EX.str(v.expr));
  if (isMat(v) || (Array.isArray(v) && typeof v[0] === 'number')) {
    const M = isMat(v) ? v : v.map(x => [x]);
    const t = h('table', { class: 'mtab' });
    const hl = o.hl || (() => false);
    if (o.colLabels) t.appendChild(h('tr', { class: 'clabs' }, ...M[0].map((_, j) => h('td', null, o.colLabels[j] ?? ''))));
    M.forEach((r, i) => t.appendChild(h('tr', null, ...r.map((x, j) => h('td', { class: hl(i, j) ? 'hl' : null }, fmtNum(x))))));
    const wrap = h('span', { class: 'matwrap' },
      o.rowLabels ? h('table', { class: 'rlabs' }, ...(o.colLabels ? [h('tr', null, h('td', null, ''))] : []), ...o.rowLabels.map(l => h('tr', null, h('td', null, l)))) : null,
      h('span', { class: 'mat' }, t),
      o.dims !== false ? h('span', { class: 'mdims' }, `${M.length}×${M[0].length}`) : null,
      h('button', { class: 'copyb', title: 'Copy as numpy array', onclick: e => copyText(pyArr(v), e.target) }, 'copy'));
    return wrap;
  }
  if (Array.isArray(v)) return h('span', null, v.join(', '));
  if (typeof v === 'number') return h('span', { class: 'num' }, fmtNum(v));
  return h('span', { html: String(v) });
}

class Report {
  constructor() { this.parts = {}; SECTIONS.forEach(([k]) => (this.parts[k] = [])); this.codeStr = null; this.extra = []; }
  _push(sec, node) { this.parts[sec].push(node); return this; }
  detect(txt) { return this._push('detect', h('div', { class: 'detect', html: txt })); }
  given(label, val, o) { return this._push('given', this.row(label, val, o)); }
  find(txt) { return this._push('find', h('div', { class: 'find', html: txt })); }
  formula(txt, note) { return this._push('formula', h('div', { class: 'formula' }, h('span', { html: txt }), note ? h('span', { class: 'fnote', html: note }) : null)); }
  step(label, val, o) { return this._push('work', this.row(label, val, o)); }
  /* a merged page: run another solver into its own sub-report and show it as one titled block */
  part(title, fn) {
    const r = new Report();
    try { fn(r); } catch (err) {
      if (!(err instanceof UserError)) throw err;
      r.note('Cannot compute: ' + esc(err.message), 'err', 'answer');
    }
    return this._push('parts', h('section', { class: 'part' }, h('h2', { class: 'parth', html: title }), r.render(false, ['given', 'find'])));
  }
  raw(html) { return this._push('raw', h('div', { class: 'rawbox', html })); }
  text(html, sec = 'work') { return this._push(sec, h('div', { class: 'txt', html })); }
  note(html, kind = 'info', sec = 'work') { return this._push(sec, h('div', { class: 'note ' + kind, html })); }
  table(headers, rows, sec = 'work', o = {}) {
    const t = h('table', { class: 'rtable' + (o.cls ? ' ' + o.cls : '') },
      h('tr', null, ...headers.map(x => h('th', { html: x }))),
      ...rows.map(r => h('tr', { class: r.cls || null }, ...(r.cells || r).map(c => h('td', null, typeof c === 'number' ? fmtNum(c) : c instanceof Node ? c : h('span', { html: String(c) }))))));
    return this._push(sec, h('div', { class: 'tscroll' }, t));
  }
  answer(label, val, o = {}) {
    if (o.sub === undefined && typeof val === 'number' && !Fmt.frac && isFinite(val)) {
      const f = fracOf(val, 1000);
      if (f && f[1] !== 1) o = { ...o, sub: `= ${f[0]}/${f[1]}  (fraction)` };
    }
    const txt = o.copy ?? (typeof val === 'number' ? fmtNum(val) : isMat(val) || Array.isArray(val) ? matText(val) : String(val).replace(/<[^>]+>/g, ''));
    return this._push('answer', h('div', { class: 'ans' },
      h('div', { class: 'anslabel', html: label }),
      h('div', { class: 'ansval' }, renderVal(val, o)),
      o.sub ? h('div', { class: 'anssub', html: o.sub }) : null,
      h('button', { class: 'copyb vis', title: 'Copy answer', onclick: e => copyText(txt, e.target) }, 'copy')));
  }
  check(label, val, o) { return this._push('check', this.row(label, val, o)); }
  /* "question wording → value" table. rows: { q: wording(s), ko: 뜻, f: formula, v: number | html, star } */
  terms(rows, title = '문제에서 이렇게 물으면 → 이 값을 쓰세요 (question wording → value)') {
    const exact = x => (typeof exactForm === 'function' ? exactForm(x) : (f => (f && f[1] !== 1 ? `${f[0]}/${f[1]}` : ''))(fracOf(x, 1000)));
    return this._push('answer', h('div', { class: 'terms' }, h('div', { class: 'termshead', html: title }),
      ...rows.filter(Boolean).map(r => {
        const isNum = typeof r.v === 'number';
        const txt = isNum ? fmtNum(r.v) : String(r.v);
        const ex = isNum && isFinite(r.v) && !Number.isInteger(r.v) ? exact(r.v) : '';
        return h('div', { class: 'term' + (r.star ? ' star' : '') },
          h('div', { class: 'tq' }, h('div', { class: 'tqw', html: r.q }), r.ko ? h('div', { class: 'tko', html: r.ko }) : null, r.f ? h('div', { class: 'tf', html: r.f }) : null),
          h('div', { class: 'tv' }, h('span', { class: 'tvn', html: isNum ? esc(txt) : txt }), ex ? h('span', { class: 'tvf' }, '= ' + ex) : null,
            h('button', { class: 'copyb vis', onclick: e => copyText(isNum ? txt : txt.replace(/<br\s*\/?>/g, '\n').replace(/<[^>]+>/g, ''), e.target) }, 'copy')));
      })));
  }
  code(py) { this.codeStr = py; return this; }
  row(label, val, o = {}) {
    return h('div', { class: 'rrow' + (o.cls ? ' ' + o.cls : '') },
      h('span', { class: 'rlabel', html: label + (val !== undefined ? ' =' : '') }),
      val !== undefined ? renderVal(val, o) : null,
      o.note ? h('span', { class: 'rnote', html: o.note }) : null);
  }
  render(codeOpen, skip = []) {
    const out = h('div', { class: 'report' });
    for (const [k, title] of SECTIONS) {
      if (!this.parts[k].length || skip.includes(k)) continue;
      out.appendChild(h('section', { class: 'rsec sec-' + k }, title ? h('h3', null, title) : null, ...this.parts[k]));
    }
    if (this.codeStr) {
      const pre = h('pre', { class: 'code' }, this.codeStr);
      out.appendChild(h('details', { class: 'codebox', open: codeOpen || null },
        h('summary', null, 'Python code (numpy)',
          h('button', { class: 'copyb vis', onclick: e => { e.preventDefault(); copyText(this.codeStr, e.target); } }, 'copy code')),
        pre));
    }
    return out;
  }
}

      ctl.value = def ?? '';
      ctl.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); this.solve(); } });
    }
    if (this.cur && this.cur.live) {
      ctl.addEventListener('input', () => { clearTimeout(this.liveT); this.liveT = setTimeout(() => this.solve(true), 250); });
    }
    this.inputs[spec.k] = { spec, ctl };
    wrap.append(label, ctl);
    if (spec.hint) wrap.appendChild(h('div', { class: 'ihint', html: spec.hint }));
    return wrap;
  },
  linkCols(k, d) {
    for (const spec of this.cur.inputs) if (spec.colsFrom === k && this.editors[spec.k]) this.editors[spec.k].setCols(d);
  },
  linkRows(k, rows) {
    const t = this.cur;
    for (const spec of t.inputs) {
      if (spec.link === k && this.editors[spec.k]) this.editors[spec.k].setRows(rows);
      const srcSpec = t.inputs.find(s => s.k === k);
      if (srcSpec && srcSpec.link === spec.k && this.editors[spec.k]) this.editors[spec.k].setRows(rows);
    }
  },
  rawValues() {
    const out = {};
    for (const [k, ed] of Object.entries(this.editors)) { ed.sync(); out[k] = ed.raw; }
    for (const [k, { spec, ctl }] of Object.entries(this.inputs)) out[k] = spec.type === 'check' ? ctl.checked : ctl.value;
    return out;
  },
  applyShowIf() {
    if (!this.cur) return;
    const raw = this.rawValues();
    const bias = this.inputs.bias ? !!this.inputs.bias.ctl.checked : false;
    for (const spec of this.cur.inputs || []) if (spec.biasAware && this.editors[spec.k]) this.editors[spec.k].setBias(bias);
    for (const spec of this.cur.inputs || []) {
      if (!spec.showIf) continue;
      const node = this.main.querySelector(`.inp[data-k="${spec.k}"]`);
      if (node) node.classList.toggle('hidden', !spec.showIf(raw));
    }
  },
  values() {
    const raw = this.rawValues();
    const v = {};
    for (const spec of this.cur.inputs || []) {
      if (spec.showIf && !spec.showIf(raw)) { v[spec.k] = undefined; continue; }
      const lab = (spec.sym || (spec.label || spec.k).replace(/<[^>]+>/g, ''));
      if (spec.type === 'matrix' || spec.type === 'vector' || spec.type === 'form') { v[spec.k] = this.editors[spec.k].value(); continue; }
      const r = raw[spec.k];
      try {
        switch (spec.type) {
          case 'number': v[spec.k] = String(r).trim() === '' ? (spec.optional ? null : uerr('empty')) : EX.constVal(r); break;
          case 'int': { const x = EX.constVal(r); if (!Number.isInteger(x)) uerr('must be an integer'); v[spec.k] = x; break; }
          case 'list': v[spec.k] = String(r).trim() === '' && spec.optional ? null : parseList(r); break;
          case 'labels': v[spec.k] = parseLabels(r); break;
          case 'check': v[spec.k] = !!r; break;
          default: v[spec.k] = r;
        }
      } catch (err) {
        throw new UserError(`${lab}: ${err.message}`);
      }
    }
    return { v, raw };
  },
  solve(quiet) {
    const t = this.cur;
    if (!t) return;
    let R = new Report();
    try {
      const { v, raw } = this.values();
      Store.set('tool:' + t.id, raw);
      t.solve(v, R);
      this.resultBox.replaceChildren(R.render(t.codeOpen));
    } catch (err) {
      if (err instanceof UserError) {
        this.resultBox.replaceChildren(h('div', { class: 'note err big' }, h('b', null, 'Cannot compute: '), h('span', { html: esc(err.message) })));
      } else {
        console.error(err);
        this.resultBox.replaceChildren(h('div', { class: 'note err big' }, h('b', null, 'Error: '), String(err && err.message || err)));
      }
    }
    if (!quiet) this.resultBox.scrollIntoView({ behavior: 'smooth', block: 'start' });
  },
};

/* ---------- shared helpers for tools ---------- */
const sup = { '-1': '⁻¹', T: 'ᵀ' };
function yesno(b) { return b ? '<b class="yes">YES</b>' : '<b class="no">NO</b>'; }
function sysType(m, d) {
  if (m === d) return { key: 'square', name: 'Square / even-determined (m = d)', short: 'even-determined' };
  if (m > d) return { key: 'tall', name: 'Tall / over-determined (m > d)', short: 'over-determined' };
  return { key: 'wide', name: 'Wide / under-determined (m < d)', short: 'under-determined' };
}
function addBias(X) { return X.map(r => [1].concat(r)); }
function firstColOnes(X) { return X.every(r => Math.abs(r[0] - 1) < 1e-12); }
/* prepare design matrix with bias handling (never double-add) */
function designMatrix(Xraw, bias, R, name = 'X') {
  if (!bias) return { X: Xraw, added: false };
  if (firstColOnes(Xraw) && Xraw[0].length > 1) {
    R && R.note(`The first column of ${name} is already all 1s, so the bias column was <b>not</b> added again (w₀ = bias).`, 'warn');
    return { X: Xraw, added: false, already: true };
  }
  return { X: addBias(Xraw), added: true };
}
function wLabels(n, bias, prefix = 'w') {
  return Array.from({ length: n }, (_, i) => (bias ? `${prefix}${sub(i)}` : `${prefix}${sub(i + 1)}`));
}
function sub(i) { return String(i).split('').map(c => '₀₁₂₃₄₅₆₇₈₉'[+c]).join(''); }
function equationString(w, bias, names) {
  // y = w0 + w1 x1 + ...
  const terms = [];
  w.forEach((c, i) => {
    const v = bias ? (i === 0 ? '' : names[i - 1]) : names[i];
    const mag = fmtNum(Math.abs(c));
    const body = v ? (mag === '1' ? v : `${mag}${v}`) : mag;
    terms.push({ neg: c < 0, body });
  });
  let s = '';
  terms.forEach((t, i) => { s += i === 0 ? (t.neg ? '−' : '') + t.body : (t.neg ? ' − ' : ' + ') + t.body; });
  return 'ŷ = ' + s;
}

/* ==== common.js ==== */
'use strict';
/* =====================================================================
   common.js — shared EE2211 solving engine used by many tools
   ===================================================================== */

/* Least squares / ridge solve with automatic formula selection.
   X: m×d design matrix,  Y: m×h target matrix (h = 1 for a vector y)
   o.lambda  (0 → no ridge)
   o.mode    'auto' | 'primal' | 'dual'
   o.Xn, o.yn  symbol names used in text (for example 'X' or 'P')
   returns { W, method, exact, form } and writes steps into R */
function lsqSolve(X, Y, R, o = {}) {
  const lam = o.lambda || 0;
  const Xn = o.Xn || 'X', yn = o.yn || (Y[0].length > 1 ? 'Y' : 'y');
  const [m, d] = LA.shape(X);
  const h = Y[0].length;
  const XT = LA.T(X);
  const st = sysType(m, d);
  const rk = LA.rank(X);
  const wn = o.wn || (h > 1 ? 'Ŵ' : 'ŵ');
  const ynDisp = yn;
  let W, method, form;

  R.step(`Size of ${Xn}`, undefined, { note: `m = ${m} rows (samples/equations), d = ${d} columns (parameters/unknowns) → <b>${st.name}</b>; rank(${Xn}) = ${rk}` });

  const wantDual = o.mode === 'dual' || (o.mode !== 'primal' && m < d);

  if (lam > 0) {
    if (!wantDual) {
      form = 'primal';
      R.formula(`${wn} = (${Xn}ᵀ${Xn} + λI)⁻¹ ${Xn}ᵀ${ynDisp}`, `Ridge <b>primal form</b>${o.mode === 'primal' ? ' (chosen by user)' : m > d ? ' — selected because m > d' : ' — m = d (primal and dual give the same answer)'}; I is d×d = ${d}×${d}`);
      const XtX = LA.mul(XT, X);
      const lI = LA.scale(LA.eye(d), lam);
      const A = LA.add(XtX, lI);
      const Ai = LA.inv(A);
      if (!Ai) uerr(`${Xn}ᵀ${Xn} + λI is singular — this should not happen for λ > 0.`);
      const XtY = LA.mul(XT, Y);
      R.step(`${Xn}ᵀ${Xn}`, XtX).step(`λI  (λ = ${fmtNum(lam)}, I is ${d}×${d})`, lI).step(`${Xn}ᵀ${Xn} + λI`, A)
        .step(`(${Xn}ᵀ${Xn} + λI)⁻¹`, Ai).step(`${Xn}ᵀ${ynDisp}`, XtY);
      W = LA.mul(Ai, XtY);
      method = `Ridge primal: (${Xn}ᵀ${Xn}+λI)⁻¹${Xn}ᵀ${ynDisp}`;
    } else {
      form = 'dual';
      R.formula(`${wn} = ${Xn}ᵀ(${Xn}${Xn}ᵀ + λI)⁻¹ ${ynDisp}`, `Ridge <b>dual form</b>${o.mode === 'dual' ? ' (chosen by user)' : ' — selected because m < d'}; I is m×m = ${m}×${m}`);
      const XXt = LA.mul(X, XT);
      const lI = LA.scale(LA.eye(m), lam);
      const A = LA.add(XXt, lI);
      const Ai = LA.inv(A);
      if (!Ai) uerr(`${Xn}${Xn}ᵀ + λI is singular.`);
      R.step(`${Xn}${Xn}ᵀ`, XXt).step(`λI  (λ = ${fmtNum(lam)}, I is ${m}×${m})`, lI).step(`${Xn}${Xn}ᵀ + λI`, A).step(`(${Xn}${Xn}ᵀ + λI)⁻¹`, Ai);
      const a = LA.mul(Ai, Y);
      R.step(`a = (${Xn}${Xn}ᵀ + λI)⁻¹${ynDisp}`, a);
      W = LA.mul(XT, a);
      method = `Ridge dual: ${Xn}ᵀ(${Xn}${Xn}ᵀ+λI)⁻¹${ynDisp}`;
    }
  } else if (m === d && o.mode !== 'primal' && o.mode !== 'dual') {
    const Xi = LA.inv(X);
    if (Xi) {
      form = 'inverse';
      R.formula(`${wn} = ${Xn}⁻¹${ynDisp}`, `${Xn} is square and invertible (det ≠ 0) → unique exact solution. (Same result as (${Xn}ᵀ${Xn})⁻¹${Xn}ᵀ${ynDisp}.)`);
      R.step(`det(${Xn})`, LA.det(X)).step(`${Xn}⁻¹`, Xi);
      W = LA.mul(Xi, Y);
      method = `${Xn}⁻¹${ynDisp}`;
    } else {
      form = 'pinv';
      R.note(`${Xn} is square but <b>singular</b> (det = 0, rank ${rk} < ${d}) → ${Xn}⁻¹ does not exist; also ${Xn}ᵀ${Xn} and ${Xn}${Xn}ᵀ are singular.`, 'err');
      W = pinvFallback(X, Y, R, Xn, ynDisp, wn);
      method = `${Xn}† ${ynDisp} (Moore–Penrose, fallback)`;
    }
  } else if (!wantDual) {
    const XtX = LA.mul(XT, X);
    const inv = LA.inv(XtX);
    R.formula(`${wn} = (${Xn}ᵀ${Xn})⁻¹${Xn}ᵀ${ynDisp}`, `least squares / left inverse ${Xn}† = (${Xn}ᵀ${Xn})⁻¹${Xn}ᵀ${o.mode === 'primal' ? ' (primal, chosen by user)' : ' — used because m > d'}`);
    R.step(`${Xn}ᵀ`, XT).step(`${Xn}ᵀ${Xn}`, XtX, { note: `det(${Xn}ᵀ${Xn}) = ${fmtNum(LA.det(XtX))}` });
    if (inv) {
      form = 'primal';
      const XtY = LA.mul(XT, Y);
      R.step(`(${Xn}ᵀ${Xn})⁻¹`, inv).step(`${Xn}ᵀ${ynDisp}`, XtY);
      W = LA.mul(inv, XtY);
      method = `(${Xn}ᵀ${Xn})⁻¹${Xn}ᵀ${ynDisp}`;
    } else {
      form = 'pinv';
      R.note(`${Xn}ᵀ${Xn} is <b>not invertible</b> (rank(${Xn}) = ${rk} < d = ${d}) → the left inverse (${Xn}ᵀ${Xn})⁻¹${Xn}ᵀ does not exist. The EE2211 formula cannot be applied. Options: add ridge (λ > 0), or use the Moore–Penrose pseudoinverse below.`, 'err');
      W = pinvFallback(X, Y, R, Xn, ynDisp, wn);
      method = `${Xn}† ${ynDisp} (fallback)`;
    }
  } else {
    const XXt = LA.mul(X, XT);
    const inv = LA.inv(XXt);
    R.formula(`${wn} = ${Xn}ᵀ(${Xn}${Xn}ᵀ)⁻¹${ynDisp}`, `right inverse ${Xn}† = ${Xn}ᵀ(${Xn}${Xn}ᵀ)⁻¹${o.mode === 'dual' ? ' (dual, chosen by user)' : ' — used because m < d'} → unique <b>constrained</b> (minimum-norm) solution`);
    R.step(`${Xn}ᵀ`, XT).step(`${Xn}${Xn}ᵀ`, XXt, { note: `det(${Xn}${Xn}ᵀ) = ${fmtNum(LA.det(XXt))}` });
    if (inv) {
      form = 'dual';
      R.step(`(${Xn}${Xn}ᵀ)⁻¹`, inv);
      W = LA.mul(XT, LA.mul(inv, Y));
      method = `${Xn}ᵀ(${Xn}${Xn}ᵀ)⁻¹${ynDisp}`;
    } else {
      form = 'pinv';
      R.note(`${Xn}${Xn}ᵀ is <b>not invertible</b> (rank(${Xn}) = ${rk} < m = ${m}) → the right inverse does not exist.`, 'err');
      W = pinvFallback(X, Y, R, Xn, ynDisp, wn);
      method = `${Xn}† ${ynDisp} (fallback)`;
    }
  }
  const E = LA.sub(LA.mul(X, W), Y);
  const sse = E.flat().reduce((s, x) => s + x * x, 0);
  const exact = sse < 1e-12 * Math.max(1, Y.flat().reduce((s, x) => s + x * x, 0));
  return { W, method, form, exact, sse, E, rank: rk, st };
}

function pinvFallback(X, Y, R, Xn, yn, wn) {
  const P = LA.pinv(X);
  R.step(`${Xn}† (Moore–Penrose pseudoinverse via Singular Value Decomposition (SVD), numpy.linalg.pinv)`, P, { note: 'Not an EE2211 closed-form; gives the minimum-norm least-squares answer.' });
  return LA.mul(P, Y);
}

/* consistency: rank(X) vs rank([X|y]) */
function consistency(X, y) {
  const rX = LA.rank(X);
  const rXy = LA.rank(LA.hstack(X, y.map ? (Array.isArray(y[0]) ? y : y.map(v => [v])) : y));
  const d = X[0].length;
  let kind;
  if (rX < rXy) kind = 'none';
  else if (rX === d) kind = 'unique';
  else kind = 'infinite';
  return { rX, rXy, kind };
}

/* ---------- polynomial features ---------- */
function combosWithRep(n, k, start = 0, pre = [], out = []) {
  if (k === 0) { out.push(pre.slice()); return out; }
  for (let i = start; i < n; i++) { pre.push(i); combosWithRep(n, k - 1, i, pre, out); pre.pop(); }
  return out;
}
function polyTerms(d, p, order = 'sklearn') {
  const terms = [[]];
  for (let deg = 1; deg <= p; deg++) {
    let c = combosWithRep(d, deg);
    if (order === 'lecture' && deg >= 2) {
      const pure = c.filter(t => t.every(i => i === t[0]));
      const mixed = c.filter(t => !t.every(i => i === t[0]));
      c = mixed.concat(pure);
    }
    terms.push(...c);
  }
  return terms;
}
function termLabel(t, names) {
  if (!t.length) return '1';
  const cnt = {};
  t.forEach(i => (cnt[i] = (cnt[i] || 0) + 1));
  return Object.keys(cnt).map(i => names[i] + (cnt[i] > 1 ? supNum(cnt[i]) : '')).join('·');
}
function supNum(n) { return String(n).split('').map(c => '⁰¹²³⁴⁵⁶⁷⁸⁹'[+c]).join(''); }
function featNames(d) { return d === 1 ? ['x'] : Array.from({ length: d }, (_, i) => 'x' + (i + 1)); }
function polyExpand(X, p, order = 'sklearn') {
  const d = X[0].length;
  const terms = polyTerms(d, p, order);
  const names = featNames(d);
  const P = X.map(r => terms.map(t => t.reduce((s, i) => s * r[i], 1)));
  return { P, labels: terms.map(t => termLabel(t, names)), terms };
}

/* ---------- labels / one-hot ---------- */
function uniqSorted(labels) {
  const u = [...new Set(labels)];
  const allNum = u.every(x => !isNaN(parseFloat(x)) && isFinite(x));
  return allNum ? u.sort((a, b) => parseFloat(a) - parseFloat(b)) : u.sort((a, b) => EX.natSort(String(a), String(b)));
}
function oneHot(labels, classes) {
  classes = classes || uniqSorted(labels);
  return { Y: labels.map(l => classes.map(c => (String(c) === String(l) ? 1 : 0))), classes };
}

/* map binary labels → ±1  (EE2211: class1 → +1, class2 → −1; {0,1}: 1 → +1, 0 → −1) */
function binaryMap(labels, posLabel) {
  const u = uniqSorted(labels.map(String));
  if (u.length !== 2) uerr(`Binary classification needs exactly 2 distinct labels, got ${u.length}: {${u.join(', ')}}`);
  let pos = posLabel;
  if (pos == null || pos === '' || pos === 'auto') {
    if (u.includes('1') && u.includes('-1')) pos = '1';
    else if (u.includes('0') && u.includes('1')) pos = '1';
    else pos = u[0];
  }
  pos = String(pos);
  if (!u.includes(pos)) uerr(`"+1 label" ${pos} is not one of the labels {${u.join(', ')}}`);
  const neg = u.find(x => x !== pos);
  return { y: labels.map(l => (String(l) === pos ? 1 : -1)), pos, neg };
}

/* sign with EE2211 convention score ≥ 0 → +1 */
const sgn = s => (s >= 0 ? 1 : -1);

/* pretty equation for polynomial / general labels */
function modelEquation(w, labels, yname = 'ŷ') {
  let s = '';
  w.forEach((c, i) => {
    const lab = labels[i] === '1' ? '' : labels[i];
    const mag = fmtNum(Math.abs(c));
    if (Math.abs(c) < 1e-12 && w.length > 1) return;
    const body = lab ? (mag === '1' ? lab : mag + (/^[a-z]/i.test(lab) ? '' : '·') + lab) : mag;
    s += s === '' ? (c < 0 ? '−' : '') + body : (c < 0 ? ' − ' : ' + ') + body;
  });
  return `${yname} = ${s || '0'}`;
}

      [/ridge|lambda|λ|regulari/, 'ridgeauto', 6], [/polynomial|(2nd|3rd|\d+th|second|third).?order|quadratic|cubic/, 'polytrain', 6], [/one.?hot|multi.?(class|category)|argmax/, 'multitrain'],
      [/sign|binary|class ?1|class ?2|classif/, 'bintrain'], [/regression|least square|fit a line|intercept|bias|offset/, 'lrtrain', 2], [/predict|test/, 'lrtrain', 1],
      [/xw ?= ?y|system|even.?determined|over.?determined|under.?determined|solve for w/, 'solve'], [/invertible|inverse/, 'invcheck'], [/left inverse|right inverse|pseudo|dagger|†/, 'pinv'],
      [/determinant|det\(/, 'det'], [/cofactor/, 'cofactor'], [/adjugate|adjoint/, 'adj'], [/minor/, 'minor'], [/rank/, 'rank'], [/linearly (in)?dependent/, 'linindep'],
      [/derivative|differentiat/, 'deriv'], [/gradient|∇/, 'grad'], [/jacobian/, 'jacobian'], [/minimum|maximum|minimi|maximi|argmin|argmax|extrem/, 'minmax1d'],
      [/linear function|affine/, 'linaff'], [/loss|cost|objective|j\(w\)/, 'lrloss'], [/mse|mean squared/, 'mse'], [/multiple outputs|multi.?output/, 'lrmulti'],
      [/parameters to learn|how many parameters/, 'polycount'], [/nearest neighbo/, 'nn'], [/supervised|unsupervised|reinforcement|inductive|deductive|causal/, 'facts'],

tool({
  id: 'matops', cat: 'matrix', name: 'Matrix ± × (A+B, A−B, AB, BA, kA, AᵀB…)', short: 'A±B, AB',
  kw: 'add subtract multiply product matrix-matrix 더하기 빼기 곱 행렬곱 scalar',
  desc: 'Two matrices → chosen operation. Dimensions are checked first and the reason is shown if impossible.',
  inputs: [
    { k: 'op', type: 'select', label: 'Operation', def: 'AB', options: [['AB', 'AB (matrix product)'], ['BA', 'BA'], ['A+B', 'A + B'], ['A-B', 'A − B'], ['kA', 'k·A (scalar × matrix)'], ['AtB', 'AᵀB'], ['ABt', 'ABᵀ'], ['AtA', 'AᵀA and AAᵀ'], ['had', 'A ∘ B (element-wise, numpy A*B)']] },
    { k: 'k', type: 'number', label: 'k (scalar)', def: '2', showIf: r => r.op === 'kA' },
    { k: 'A', type: 'matrix', label: 'A', def: [[1, 4], [0, 4], [3, -2]], group: 'm' },
    { k: 'B', type: 'matrix', label: 'B', def: [[1, 4, 3], [0, 4, 2]], group: 'm', showIf: r => !['kA', 'AtA'].includes(r.op) },
  ],
  solve(v, R) {
    const { A, B, op } = v;
    R.given('A', A, { note: `A is ${LA.dims(A)}` });
    if (B) R.given('B', B, { note: `B is ${LA.dims(B)}` });
    let res, name, rule, code;
    const [m, n] = LA.shape(A), [p, q] = B ? LA.shape(B) : [0, 0];
    switch (op) {
      case 'AB': name = 'AB'; rule = `(${m}×${n})(${p}×${q}) → needs n = p: ${n} ${n === p ? '=' : '≠'} ${p}`; res = LA.mul(A, B, 'A', 'B'); code = 'A @ B'; break;
      case 'BA': name = 'BA'; rule = `(${p}×${q})(${m}×${n}) → needs q = m: ${q} ${q === m ? '=' : '≠'} ${m}`; res = LA.mul(B, A, 'B', 'A'); code = 'B @ A'; break;
      case 'A+B': name = 'A + B'; rule = 'same size required'; res = LA.add(A, B); code = 'A + B'; break;
      case 'A-B': name = 'A − B'; rule = 'same size required'; res = LA.sub(A, B); code = 'A - B'; break;
      case 'kA': name = `${fmtNum(v.k)}·A`; rule = 'every entry multiplied by k'; res = LA.scale(A, v.k); code = `${pyNum(v.k)} * A`; break;
      case 'AtB': name = 'AᵀB'; rule = `Aᵀ is ${n}×${m}; needs m = p: ${m} ${m === p ? '=' : '≠'} ${p}`; res = LA.mul(LA.T(A), B, 'Aᵀ', 'B'); code = 'A.T @ B'; break;
      case 'ABt': name = 'ABᵀ'; rule = `Bᵀ is ${q}×${p}; needs n = q: ${n} ${n === q ? '=' : '≠'} ${q}`; res = LA.mul(A, LA.T(B), 'A', 'Bᵀ'); code = 'A @ B.T'; break;
      case 'AtA': {
        R.formula('AᵀA is d×d (n×n) ;  AAᵀ is m×m', 'They are different matrices — do not confuse them.');
        R.answer(`AᵀA &nbsp;<span class="muted">(${n}×${n})</span>`, LA.mul(LA.T(A), A));
        R.answer(`AAᵀ &nbsp;<span class="muted">(${m}×${m})</span>`, LA.mul(A, LA.T(A)));
        R.code(`import numpy as np\nA = ${pyArr(A)}\nprint(A.T @ A)\nprint(A @ A.T)`);
        return;
      }
      case 'had': name = 'A ∘ B'; rule = 'element-wise, same size'; if (m !== p || n !== q) uerr(`A ∘ B needs the same size: A is ${m}×${n}, B is ${p}×${q}`); res = A.map((r, i) => r.map((x, j) => x * B[i][j])); code = 'A * B   # element-wise (NOT matrix product)'; break;
    }
    R.find(name);
    R.formula(name, 'Dimension check: ' + rule);
    if (op === 'AB' || op === 'BA') R.step('Each entry', undefined, { note: '(row i of left) · (column j of right) = Σₖ leftᵢₖ rightₖⱼ' });
    R.answer(`${name} &nbsp;<span class="muted">(${LA.dims(res)})</span>`, res);
    R.code(`import numpy as np\nA = ${pyArr(A)}\n${B ? `B = ${pyArr(B)}\n` : ''}print(${code})`);
  },
});

tool({
  id: 'vecops', cat: 'matrix', name: 'Vector ops: x±y, a·x, dot product xᵀy, norm, angle', short: 'Vectors / dot',
  kw: 'vector add subtract scalar dot inner product norm length euclidean angle cos 내적 벡터 길이',
  inputs: [
    { k: 'x', type: 'vector', label: 'x', def: [2, 3], group: 'm' },

  solve(v, R) {
    const { x, y, a } = v;

    R.given('x', x).given('y', y).given('a', a);
    const dot = LA.dot(x, y), nx = LA.norm(x), ny = LA.norm(y);
    R.formula('x·y = xᵀy = Σ xᵢyᵢ = ‖x‖‖y‖cos θ ;  ‖x‖ = √(x·x)');
    R.step('x + y', x.map((t, i) => t + y[i])).step('x − y', x.map((t, i) => t - y[i])).step(`a·x`, x.map(t => a * t)).step('xᵀ (row)', [x]);
    R.step('xᵀy', undefined, { note: x.map((t, i) => `(${fmtNum(t)})(${fmtNum(y[i])})`).join(' + ') + ' = ' + fmtNum(dot) });
    R.answer('Dot / inner product xᵀy', dot, { sub: `(1×${x.length})(${y.length}×1) → scalar` });
    R.answer('‖x‖ (Euclidean length)', nx, { sub: `√(${x.map(t => fmtNum(t) + '²').join(' + ')})` });
    R.answer('‖y‖', ny);
    if (nx > 0 && ny > 0) {
      const c = dot / (nx * ny);
      R.check('cos θ = xᵀy / (‖x‖‖y‖)', c, { note: `θ = ${fmtNum(Math.acos(Math.max(-1, Math.min(1, c))) * 180 / Math.PI)}°` });

/* ---------------- DETERMINANT FAMILY ---------------- */
function detSteps(A, R, label = 'det(A)', rowSel = 0) {
  const n = A.length;
  const f = x => (x < 0 ? `(${fmtNum(x)})` : fmtNum(x));
  if (n === 1) { R.step(label, A[0][0]); return A[0][0]; }
  if (n === 2) {
    const [[a, b], [c, d]] = A;
    const v = a * d - b * c;
    R.formula('det = ad − bc');
    R.step(label, undefined, { note: `${f(a)}·${f(d)} − ${f(b)}·${f(c)} = ${fmtNum(a * d)} − ${f(b * c)} = <b>${fmtNum(v)}</b>` });
    return v;
  }
  // cofactor expansion along the row with most zeros (row 1 if tie)
  let row = rowSel, best = 0;
  if (rowSel == null || rowSel < 0 || rowSel >= n) { row = 0; best = -1; A.forEach((r, i) => { const z = r.filter(x => x === 0).length; if (z > best) { best = z; row = i; } }); }
  if (n === 3 && row === 0) {
    const [[a, b, c], [d, e, f2], [g, hh, i]] = A;
    R.formula('det(A) = a(ei − fh) − b(di − fg) + c(dh − eg)', 'cofactor expansion along row 1: Σⱼ (−1)^(1+j) a₁ⱼ M₁ⱼ');
  } else {
    R.formula(`det(A) = Σⱼ (−1)^(i+j) aᵢⱼ Mᵢⱼ`, `cofactor expansion along row ${row + 1}${best > 0 ? ' (the row with most zeros)' : ''}`);
  }
  let total = 0;
  const rows = [];
  for (let j = 0; j < n; j++) {
    const a = A[row][j];
    const Mm = LA.minorMat(A, row, j);
    const M = LA.det(Mm);
    const s = (row + j) % 2 ? -1 : 1;
    total += s * a * M;
    rows.push([`a${sub(row + 1)}${sub(j + 1)} = ${fmtNum(a)}`, renderVal(Mm, { dims: false }), fmtNum(M), s > 0 ? '+' : '−', fmtNum(s * a * M)]);
  }
  R.table(['element', 'minor matrix (delete row & col)', 'Mᵢⱼ = det', 'sign (−1)^(i+j)', 'sign·aᵢⱼ·Mᵢⱼ'], rows);
  if (n === 3 && row === 0) {
    const [[a, b, c], [d, e, f2], [g, hh, i]] = A;
    R.step(label, undefined, { note: `${f(a)}(${f(e)}·${f(i)} − ${f(f2)}·${f(hh)}) − ${f(b)}(${f(d)}·${f(i)} − ${f(f2)}·${f(g)}) + ${f(c)}(${f(d)}·${f(hh)} − ${f(e)}·${f(g)}) = <b>${fmtNum(total)}</b>` });
  } else R.step(label, undefined, { note: rows.map(r => r[4]).join(' + ').replace(/\+ -/g, '− ') + ` = <b>${fmtNum(total)}</b>` });
  return Math.abs(total) < 1e-11 * Math.max(1, LA.maxAbs(A)) ** n ? 0 : total;
}
function needSquare(A, what) {
  if (A.length !== A[0].length) uerr(`${what} only exists for a SQUARE matrix. This matrix is ${LA.dims(A)} (non-square) → it has no ${what}.`);
}

tool({
  id: 'inverse', cat: 'detfam', name: 'Inverse A⁻¹ = adj(A)/det(A)', short: 'Inverse A⁻¹',
  kw: 'inverse inv 역행렬 invertible singular nonsingular',
  inputs: [{ k: 'A', type: 'matrix', label: 'A', def: [[1, 1], [1, -2]] }],
  solve(v, R) {
    const A = v.A;
    const [m, n] = LA.shape(A);
    R.given('A', A, { note: LA.dims(A) });
    R.find('A⁻¹ (ordinary inverse — NOT Aᵀ and NOT A†)');
    const rk = LA.rank(A);
    R.table(['check', 'result'], [
      ['Is A square?', m === n ? yesno(true) : yesno(false) + ` (${m}×${n})`],
      ['rank(A)', `${rk}${m === n ? (rk === n ? ' = n (full rank)' : ` < n = ${n}`) : ''}`],
      ['det(A) ≠ 0?', m === n ? `det = ${fmtNum(LA.det(A))} → ${yesno(rk === n)}` : 'no determinant (non-square)'],
    ]);
    if (m !== n) {
      R.answer('A⁻¹', '<b class="no">A⁻¹ does not exist</b>', { sub: `A is ${m}×${n}, not square. Use the pseudoinverse: ${m > n ? 'left inverse (AᵀA)⁻¹Aᵀ' : 'right inverse Aᵀ(AAᵀ)⁻¹'} → see “Pseudoinverse X†”.` });
      return;
    }
    if (rk < n) {
      R.answer('A⁻¹', '<b class="no">A⁻¹ does not exist</b>', { sub: `det(A) = 0 (rank ${rk} < ${n}) → A is singular.` });
      return;
    }
    R.formula('A⁻¹ = (1/det(A)) · adj(A)', n === 2 ? 'for 2×2: (1/(ad−bc)) [d −b; −c a]' : 'adj(A) = Cᵀ');
    const d = detSteps(A, R);
    const adj = LA.adj(A);
    if (n > 2) R.step('Cofactor matrix C', LA.cofactors(A));
    R.step('adj(A) = Cᵀ', adj);
    const inv = LA.scale(adj, 1 / d);
    R.step(`1/det(A) = 1/${fmtNum(d)}`, 1 / d);
    R.answer('A⁻¹', inv, { sub: Fmt.frac ? '' : 'tip: tick “fractions” (top bar) to see exact fractions' });
    R.check('A·A⁻¹', LA.clean(LA.mul(A, inv)), { note: LA.isIdentity(LA.mul(A, inv)) ? '= I ✓' : '≠ I ?' });
    R.code(`import numpy as np\nfrom numpy.linalg import inv\nA = ${pyArr(A)}\nprint(inv(A))\nprint(A @ inv(A))  # should be identity`);
  },
});

tool({
  id: 'rank', cat: 'diag', name: 'Rank (row-echelon steps)', short: 'Rank',
  kw: 'rank echelon 계수 full rank row reduction linearly independent rows columns matrix_rank',
  inputs: [{ k: 'A', type: 'matrix', label: 'A', def: [[1, 2, 3], [4, 5, 6], [7, 8, 9]] }],
  solve(v, R) {
    const A = v.A;
    const [m, n] = LA.shape(A);
    R.given('A', A, { note: LA.dims(A) });
    R.find('rank(A) = max number of linearly independent rows (= columns)');
    R.formula('Row-reduce to echelon form; rank = number of non-zero rows (pivots)');
    const { R: E, steps } = LA.rrefSteps(A);
    if (m * n <= 64) steps.forEach(s => R.step(s.op, s.M, { dims: false }));
    R.step('Row echelon form', E);
    const rk = LA.rank(A);
    R.answer('rank(A)', rk, { sub: rk === Math.min(m, n) ? `full rank (= min(m, d) = ${Math.min(m, n)})` : `rank-deficient (max possible ${Math.min(m, n)})` });
    R.check('rank(Aᵀ)', rk).check('rank(AᵀA)', LA.rank(LA.mul(LA.T(A), A))).check('rank(AAᵀ)', LA.rank(LA.mul(A, LA.T(A))));
    R.note(`rank = ${n} ⇒ columns independent ⇒ AᵀA (${n}×${n}) invertible: ${yesno(rk === n)} &nbsp;|&nbsp; rank = ${m} ⇒ rows independent ⇒ AAᵀ (${m}×${m}) invertible: ${yesno(rk === m)}`, 'info', 'check');
    R.code(`import numpy as np\nfrom numpy.linalg import matrix_rank\nA = ${pyArr(A)}\nprint(matrix_rank(A))`);
  },
});

function invReport(A, R) {
  const [m, n] = LA.shape(A);
  const rk = LA.rank(A);
  const sq = m === n;
  const rows = [
    ['dimensions', `${m} × ${n} → ${sq ? 'square' : m > n ? 'tall (m > d)' : 'wide (m < d)'}`],
    ['rank(A)', `${rk}`],
    ['square?', yesno(sq)],
    ['det(A)', sq ? fmtNum(LA.det(A)) : '— (no determinant: not square)'],
    ['invertible (A⁻¹ exists)?', yesno(sq && rk === n) + (sq ? (rk === n ? ' det ≠ 0, full rank' : ' det = 0') : ' only square matrices')],
    ['left-invertible? (AᵀA invertible ⇔ rank = number of columns)', yesno(rk === n) + ` rank ${rk} ${rk === n ? '=' : '≠'} ${n} columns`],
    ['right-invertible? (AAᵀ invertible ⇔ rank = #rows)', yesno(rk === m) + ` rank ${rk} ${rk === m ? '=' : '≠'} ${m} rows`],
    ['columns linearly independent?', yesno(rk === n)],
    ['rows linearly independent?', yesno(rk === m)],
  ];
  R.table(['property', 'result'], rows);
  return { m, n, rk, sq };
}

tool({
  id: 'invcheck', cat: 'diag', name: 'Invertibility checker (+ left/right inverse)', short: 'Invertible?',
  kw: 'invertible singular left inverse right inverse 역행렬 존재 determinant full rank True / False (T/F) true false',
  desc: 'Answers all the True / False (T/F) style questions: invertible? left-invertible? right-invertible? has determinant?',
  inputs: [{ k: 'A', type: 'matrix', label: 'A', def: [[1, 2, 3], [4, 5, 6]] }],
  solve(v, R) {
    const A = v.A;
    R.given('A', A, { note: LA.dims(A) });
    R.find('Is A invertible? Does a left / right inverse exist? Why?');
    const { m, n, rk, sq } = invReport(A, R);
    let verdict;
    if (sq) verdict = rk === n ? 'A is <b>INVERTIBLE</b> (square, det ≠ 0, full rank)' : 'A is <b>NOT invertible</b> (singular: det = 0, rank < n)';
    else verdict = `A is <b>NOT invertible</b> (not square, no determinant).<br>Left-invertible (AᵀA invertible): ${yesno(rk === n)}${rk === n ? ' → A† = (AᵀA)⁻¹Aᵀ' : ''}<br>Right-invertible (AAᵀ invertible): ${yesno(rk === m)}${rk === m ? ' → A† = Aᵀ(AAᵀ)⁻¹' : ''}`;
    R.answer('Verdict', verdict);
    if (sq && rk === n) R.check('A⁻¹', LA.inv(A));
    if (!sq && rk === n) R.check('left inverse (AᵀA)⁻¹Aᵀ', LA.mul(LA.inv(LA.mul(LA.T(A), A)), LA.T(A)));
    if (!sq && rk === m) R.check('right inverse Aᵀ(AAᵀ)⁻¹', LA.mul(LA.T(A), LA.inv(LA.mul(A, LA.T(A)))));
    R.code(`import numpy as np\nfrom numpy.linalg import matrix_rank, det, inv\nA = ${pyArr(A)}\nm, n = A.shape\nr = matrix_rank(A)\nprint('rank', r, 'square', m == n)\nif m == n: print('det', det(A))\nprint('left-invertible (A^T A invertible):', r == n)\nprint('right-invertible (A A^T invertible):', r == m)`);
  },
});

tool({

  kw: 'all everything report summary 전부 한번에 matrix analysis',

});

tool({
  id: 'linindep', cat: 'diag', name: 'Linear independence of vectors', short: 'Linearly independent?',
  kw: 'linear independence dependent 선형독립 종속 vectors beta combination',
  desc: 'Enter vectors x₁…x_k as the <b>columns</b> of V (or choose rows). Dependent ⇔ β₁x₁+…+βₖxₖ = 0 for some β not all zero.',
  inputs: [
    { k: 'as', type: 'select', label: 'Vectors are the…', def: 'cols', options: [['cols', 'columns of V'], ['rows', 'rows of V']] },
    { k: 'V', type: 'matrix', label: 'V', def: [[1, 4], [2, 5], [3, 6]] },

    R.step('rank', rk);
    if (rk === k) {
      R.answer('Result', `<b class="yes">Linearly INDEPENDENT</b> (rank ${rk} = ${k})`, { sub: 'only β₁ = … = βₖ = 0 gives Σβᵢxᵢ = 0' });
    } else {
      const { R: E, pivots } = LA.rrefSteps(V, { full: true });
      const pc = pivots.map(p => p[1]);
      const free = [...Array(k).keys()].find(j => !pc.includes(j));
      const beta = Array(k).fill(0);
      beta[free] = 1;
      pivots.forEach(([r, c]) => (beta[c] = -E[r][free]));
      R.step('Reduced Row Echelon Form (RREF)', E);
      R.answer('Result', `<b class="no">Linearly DEPENDENT</b> (rank ${rk} < ${k})`, { sub: 'Example non-zero β with Σ βᵢ xᵢ = 0: β = [' + beta.map(b => fmtNum(b)).join(', ') + ']' });
      R.check('V β', LA.clean(LA.mul(V, LA.col(beta))));
    }
    if (V.length === k) R.note(`Square case: det = ${fmtNum(LA.det(V))} → ${rk === k ? 'invertible' : 'singular'}`, 'info', 'check');
    R.code(`import numpy as np\nV = ${pyArr(V)}   # vectors as columns\nprint(np.linalg.matrix_rank(V) == V.shape[1])`);
  },
});
